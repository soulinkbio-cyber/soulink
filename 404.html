<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<base href="/">
<title>soulink.bio</title>
</head>
<body>

<script>
(async ()=>{
  const res = await fetch("/index.html",{cache:"no-store"});
  const html = await res.text();
  document.open();
  document.write(html);
  document.close();

  const match = location.pathname.match(/^\/@([^\/]+)/);
  const user = match ? match[1] : "soulink";

  const wait = ()=>{
    if(window.loadProfile) window.loadProfile(user);
    else setTimeout(wait,30);
  };
  wait();
})();
</script>

</body>
</html>
