<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>soulink.bio</title>
</head>
<body>
<script>
(async function(){
  try{
    // Carga el index.html real
    const res = await fetch("/index.html", { cache:"no-store" });
    const html = await res.text();

    document.open();
    document.write(html);
    document.close();

    // Detecta /@username desde la URL
    const path = decodeURIComponent(location.pathname || "/");
    const match = path.match(/^\/@([^\/?#]+)/);
    const username = match ? match[1].replace(/^@/,"") : null;

    // Espera a que index.html esté listo y ejecuta init(username)
    const waitForInit = () => {
      if (typeof window.init === "function") {
        if (username) {
          window.init(username);
        }
      } else {
        setTimeout(waitForInit, 30);
      }
    };
    waitForInit();

  } catch (e) {
    document.body.innerHTML = `
      <div style="
        font-family: system-ui;
        padding: 24px;
        color: #fff;
        background:#0b0f14;
      ">
        Error cargando el perfil.
      </div>`;
  }
})();
</script>
</body>
</html>
