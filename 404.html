<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>soulink.bio</title>
</head>
<body>
<script>
(async function(){
  try{
    const res = await fetch("/index.html", { cache:"no-store" });
    const html = await res.text();
    document.open(); document.write(html); document.close();

    const path = decodeURIComponent(location.pathname || "/");
    const m = path.match(/^\/@([^\/?#]+)/);
    const username = m ? m[1].replace(/^@/,"") : null;

    const wait = () => {
      if (typeof window.init === "function") {
        if (username) window.init(username);
      } else setTimeout(wait, 30);
    };
    wait();
  } catch(e){
    document.body.innerHTML =
      "<div style='font-family:system-ui;padding:22px;background:#0b0f14;color:#e9eef5'>Error cargando perfil.</div>";
  }
})();
</script>
</body>
</html>
