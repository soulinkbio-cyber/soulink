<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>soulink.bio</title>
  <script>
    (function () {
      try {
        const path = decodeURIComponent(location.pathname || "/");
        const m = path.match(/^\/@([^\/?#]+)/);
        const u = m ? m[1].replace(/^@/, "") : "";
        location.replace(u ? ("/?u=" + encodeURIComponent(u)) : "/");
      } catch (e) {
        location.replace("/");
      }
    })();
  </script>
</head>
<body></body>
</html>
