<!doctype html>
<html lang="es">
<meta charset="utf-8">
<title>Redirigiendo…</title>
<script>
(function () {
  var path = location.pathname.replace(/\/+$/, "");

  // /@usuario
  var mAt = path.match(/^\/@([^\/?#]+)/);
  if (mAt) {
    var u = decodeURIComponent(mAt[1]);
    location.replace(location.origin + "/?u=" + u);
    return;
  }

  // /usuario
  var mPlain = path.match(/^\/([^\/?#]+)/);
  if (mPlain && mPlain[1]) {
    var u2 = decodeURIComponent(mPlain[1]);
    location.replace(location.origin + "/?u=" + u2);
    return;
  }

  // raíz
  location.replace(location.origin + "/");
})();
</script>
<body>Redirigiendo…</body>
</html>
