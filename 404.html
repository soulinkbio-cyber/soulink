<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>soulink.bio</title>
</head>
<body>
<script>
(async()=>{
  try{
    const r=await fetch("/index.html",{cache:"no-store"});
    document.open();document.write(await r.text());document.close();
    const m=location.pathname.match(/^\/@([^\/?#]+)/);
    const u=m?m[1]:"soulink";
    const run=()=>window.init?init(u):setTimeout(run,30);
    run();
  }catch(e){
    document.body.innerHTML="Error cargando perfil";
  }
})();
</script>
</body>
</html>
