<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>soulink.bio</title>
</head>
<body>
<script>
(async function(){
  try{
    const res = await fetch("/index.html", { cache:"no-store" });
    const html = await res.text();
    document.open();
    document.write(html);
    document.close();
  }catch(e){
    document.body.innerHTML =
      "<div style='font-family:system-ui;padding:24px'>Error cargando perfil</div>";
  }
})();
</script>
</body>
</html>
