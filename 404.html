<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>soulink.bio</title>
</head>
<body>
<script>
(async function () {
  try {
    const res = await fetch("/index.html", { cache: "no-store" });
    const html = await res.text();
    document.open();
    document.write(html);
    document.close();

    const path = decodeURIComponent(location.pathname || "/");
    const match = path.match(/^\/@([^\/?#]+)/);
    const username = match ? match[1] : null;

    function run() {
      if (typeof window.loadProfile === "function") {
        window.loadProfile(username);
      } else {
        setTimeout(run, 30);
      }
    }
    run();
  } catch (e) {
    document.body.innerHTML = "<h2 style='color:white'>Error cargando perfil</h2>";
  }
})();
</script>
</body>
</html>
