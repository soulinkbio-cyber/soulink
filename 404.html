<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>soulink.bio</title>
</head>
<body>
<script>
(async function(){
  try{
    // Carga el index.html
    const res = await fetch("/index.html", { cache:"no-store" });
    const html = await res.text();
    document.open();
    document.write(html);
    document.close();

    // Extrae username desde /@username
    const path = decodeURIComponent(location.pathname || "/");
    const match = path.match(/^\/@([^\/?#]+)/);
    const username = match ? match[1].replace(/^@/,"") : null;

    // Espera a que init exista
    const run = () => {
      if (typeof window.init === "function") {
        if (username) window.init(username);
      } else {
        setTimeout(run, 30);
      }
    };
    run();

  }catch(e){
    document.body.innerHTML =
      "<div style='font-family:system-ui;padding:24px'>Error cargando perfil</div>";
  }
})();
</script>
</body>
</html>
