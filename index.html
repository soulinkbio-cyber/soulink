<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="theme-color" content="#0b0f14" />
  <title>soulink.bio</title>

  <style>
    :root{
      --bg0:#05070a; --bg1:#0b0f14;
      --card:#0e141b; --card2:#0b1117;
      --text:#e9eef5; --muted:#9aa7b5;
      --stroke:rgba(255,255,255,.10); --stroke2:rgba(255,255,255,.06);
      --shadow:0 18px 60px rgba(0,0,0,.55);
      --radius:22px;
      --avatar:92px;
      --maxw:540px;
    }

    *{box-sizing:border-box}
    body{
      margin:0;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;
      color:var(--text);
      min-height:100svh;
      background:
        radial-gradient(1200px 650px at 18% 12%, rgba(220,240,255,.10), transparent 55%),
        radial-gradient(900px 520px at 82% 18%, rgba(120,170,255,.10), transparent 50%),
        radial-gradient(900px 520px at 50% 90%, rgba(255,255,255,.06), transparent 52%),
        linear-gradient(160deg, var(--bg0), var(--bg1) 55%, #060a10);
      overflow-x:hidden;
    }

    body::before{
      content:"";
      position:fixed; inset:0; pointer-events:none;
      background:
        linear-gradient(115deg, rgba(255,255,255,.06), transparent 35%, rgba(255,255,255,.04) 60%, transparent),
        repeating-linear-gradient(90deg, rgba(255,255,255,.016) 0 1px, transparent 1px 4px);
      mix-blend-mode:overlay;
      opacity:.55;
    }

    .wrap{max-width:var(--maxw); margin:0 auto; padding:28px 16px 26px;}

    .card{
      border-radius:var(--radius);
      border:1px solid var(--stroke2);
      background:
        radial-gradient(700px 240px at 40% 0%, rgba(255,255,255,.10), transparent 50%),
        linear-gradient(180deg, rgba(255,255,255,.05), rgba(255,255,255,.02)),
        linear-gradient(180deg, var(--card), var(--card2));
      box-shadow:var(--shadow);
      overflow:hidden;
      backdrop-filter:blur(12px);
    }

    .profile{
      padding:22px 18px 14px;
      display:flex;
      flex-direction:column;
      align-items:center;
      gap:12px;
      text-align:center;
    }

    .avatar{
      width:var(--avatar);
      height:var(--avatar);
      border-radius:26px;
      background:linear-gradient(180deg, rgba(255,255,255,.10), rgba(255,255,255,.04));
      border:1px solid var(--stroke);
      box-shadow:0 16px 32px rgba(0,0,0,.45);
      overflow:hidden;
      position:relative;
    }
    .avatar::after{
      content:"";
      position:absolute; inset:-1px;
      border-radius:26px;
      border:1px solid rgba(255,255,255,.08);
      pointer-events:none;
    }
    .avatar img{width:100%; height:100%; object-fit:cover; display:block;}

    .username{
      margin:0;
      font-size:24px;
      line-height:1.05;
      font-weight:950;
      letter-spacing:.2px;
      word-break:break-word;
    }

    .handle{
      margin:0;
      font-size:13px;
      color:var(--muted);
    }

    .iconsWrap{padding:10px 16px 18px;}
    .icons{
      display:grid;
      grid-template-columns: repeat(5, 1fr);
      gap:12px;
    }
    @media (max-width: 420px){
      .icons{grid-template-columns: repeat(4, 1fr);}
    }

    .iconBtn{
      height:54px;
      border-radius:18px;
      border:1px solid var(--stroke2);
      background:linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,.02));
      box-shadow:0 12px 22px rgba(0,0,0,.30);
      display:grid;
      place-items:center;
      text-decoration:none;
      position:relative;
      overflow:hidden;
      transition: transform .12s ease, border-color .12s ease, background .12s ease;
    }
    .iconBtn:hover{
      transform: translateY(-1px);
      border-color: rgba(255,255,255,.14);
      background:linear-gradient(180deg, rgba(255,255,255,.10), rgba(255,255,255,.03));
    }

    .iconBtn::before{
      content:"";
      position:absolute;
      inset:-40%;
      background: radial-gradient(circle at 50% 50%, var(--brandGlow, rgba(255,255,255,.10)), transparent 55%);
      opacity:.75;
      pointer-events:none;
    }

    .iconBtn svg{
      width:24px;
      height:24px;
      display:block;
      color: var(--brandColor, rgba(233,238,245,.92));
      filter: drop-shadow(0 6px 12px rgba(0,0,0,.45));
    }

    .state{padding:0 16px 16px; color:var(--muted); font-size:13px; text-align:center;}
    .footer{padding:14px 16px 16px; color:rgba(154,167,181,.85); font-size:12px; text-align:center;}
  </style>
</head>

<body>
  <div class="wrap">
    <div class="card">
      <div class="profile">
        <div class="avatar"><img id="avatarImg" alt="Avatar" /></div>
        <h1 class="username" id="nameText">@soulink</h1>
        <p class="handle" id="handleText">soulink.bio/@soulink</p>
      </div>

      <div class="iconsWrap">
        <div class="icons" id="icons"></div>
      </div>

      <div class="state" id="state"></div>
      <div class="footer">© soulink.bio</div>
    </div>
  </div>

  <script>
    const DEFAULT_USERNAME = "soulink";

    const SHEETS_CSV_URL =
      "https://docs.google.com/spreadsheets/d/e/2PACX-1vQ8qA-po2EufvnIotOaNgFsvfQqOMOFMR4KyaIGramGsEErGpOzckJYN2nPMvfsdnqoC34w_DawjNdA/pub?output=csv";

    // Colores por red
    const BRAND = {
      email:      { color:"#E9EEF5", glow:"rgba(233,238,245,.14)" },
      x:          { color:"#E9EEF5", glow:"rgba(233,238,245,.14)" },
      facebook:   { color:"#1877F2", glow:"rgba(24,119,242,.22)" },
      instagram:  { color:"#E1306C", glow:"rgba(225,48,108,.28)" },
      whatsapp:   { color:"#25D366", glow:"rgba(37,211,102,.22)" },
      threads:    { color:"#E9EEF5", glow:"rgba(233,238,245,.14)" },
      tiktok:     { color:"#00F2EA", glow:"rgba(0,242,234,.22)" },
      snapchat:   { color:"#FFFC00", glow:"rgba(255,252,0,.16)" },
      youtube:    { color:"#FF0033", glow:"rgba(255,0,51,.22)" },
      twitch:     { color:"#9146FF", glow:"rgba(145,70,255,.22)" },
      telegram:   { color:"#26A5E4", glow:"rgba(38,165,228,.22)" },
      discord:    { color:"#5865F2", glow:"rgba(88,101,242,.22)" },
      github:     { color:"#E9EEF5", glow:"rgba(233,238,245,.14)" },
      linkedin:   { color:"#0A66C2", glow:"rgba(10,102,194,.22)" },
      reddit:     { color:"#FF4500", glow:"rgba(255,69,0,.22)" },
      pinterest:  { color:"#E60023", glow:"rgba(230,0,35,.22)" },
      generic:    { color:"#E9EEF5", glow:"rgba(233,238,245,.14)" },
    };

    // Logos (SVG). Nota: se colorean con currentColor => usa BRAND para colores.
    const ICONS = {
      email: svgMail(),
      x: svgX(),
      facebook: svgFacebook(),
      instagram: svgInstagram(),
      whatsapp: svgWhatsApp(),
      threads: svgThreads(),
      tiktok: svgTikTok(),
      snapchat: svgSnapchat(),
      youtube: svgYouTube(),
      twitch: svgTwitch(),
      telegram: svgTelegram(),
      discord: svgDiscord(),
      github: svgGithub(),
      linkedin: svgLinkedIn(),
      reddit: svgReddit(),
      pinterest: svgPinterest(),
      generic: svgGeneric(),
    };

    const ORDER = [
      "email","x","facebook","instagram","whatsapp","threads","tiktok","snapchat",
      "youtube","twitch","telegram","discord","github","linkedin","reddit","pinterest"
    ];

    (async function init(){
      const u = getParam("u") || DEFAULT_USERNAME;
      await loadProfile(u);
    })();

    window.loadProfile = loadProfile;

    async function loadProfile(username){
      setState("Cargando…");
      const safeU = sanitizeUsername(username);
      document.title = `@${safeU} • soulink.bio`;
      document.getElementById("nameText").textContent = `@${safeU}`;
      document.getElementById("handleText").textContent = `soulink.bio/@${safeU}`;

      // fallback avatar (se reemplaza cuando me envíes el logo)
      setAvatar(makeSoulinkFallbackAvatar());

      try{
        const row = await fetchUserRowFromCSV(SHEETS_CSV_URL, safeU);
        if(!row){
          renderIcons([]);
          setState("Este usuario todavía no existe en la base de datos.");
          return;
        }

        // avatar: reconoce el link que el user ponga
        const avatar = row.avatar || row.avatar_url || row.pfp || row.profile_picture || row.profilepicture || row.profile_photo || row.photo || row.profile || "";
        if(avatar) setAvatar(avatar);

        const links = extractLinksFromRow(row);
        const sorted = sortLinks(links);

        renderIcons(sorted);
        setState(sorted.length ? "" : "No hay redes sociales guardadas todavía.");
      }catch(e){
        console.error(e);
        renderIcons([]);
        setState("No pude cargar la data. Verifica que el Sheet esté publicado.");
      }
    }

    function renderIcons(links){
      const box = document.getElementById("icons");
      box.innerHTML = "";

      links.forEach(l=>{
        const a = document.createElement("a");
        a.className = "iconBtn";
        a.href = l.url;
        a.target = "_blank";
        a.rel = "noopener noreferrer";
        a.title = l.type.toUpperCase();

        const b = BRAND[l.type] || BRAND.generic;
        a.style.setProperty("--brandColor", b.color);
        a.style.setProperty("--brandGlow", b.glow);

        a.innerHTML = ICONS[l.type] || ICONS.generic;
        box.appendChild(a);
      });
    }

    async function fetchUserRowFromCSV(csvUrl, username){
      const res = await fetch(csvUrl, { cache:"no-store" });
      if(!res.ok) throw new Error("CSV fetch failed: " + res.status);
      const text = await res.text();
      const { headers, rows } = parseCSV(text);

      const objs = rows.map(r=>{
        const o={}; headers.forEach((h,i)=> o[h]=(r[i]??"").trim()); return o;
      });

      const key = username.toLowerCase();
      return objs.find(o => (o.username || o.user || o.handle || "").toLowerCase() === key) || null;
    }

    function extractLinksFromRow(row){
      const links = [];
      for(const k in row){
        const rawKey = String(k||"");
        const key = normalizeHeader(rawKey);
        const val = String(row[k]||"").trim();
        if(!val) continue;

        // ignora campos no-red
        if(["username","user","handle","avatar","avatar_url","pfp","profile_picture","profilepicture","profile_photo","photo","profile","display_name","name"].includes(key)) continue;

        if(isValidUrl(val)){
          const type = normalizeType(rawKey);
          links.push({ type, url: normalizeUrl(val) });
        }
      }

      // dedupe
      const seen = new Set();
      return links.filter(l=>{
        if(seen.has(l.url)) return false;
        seen.add(l.url);
        return true;
      });
    }

    function sortLinks(links){
      const rank = (t)=> {
        const i = ORDER.indexOf(t);
        return i === -1 ? 999 : i;
      };
      return links.slice().sort((a,b)=> rank(a.type) - rank(b.type));
    }

    function normalizeType(header){
      const h = String(header||"").trim().toLowerCase();
      const clean = h.replace(/\s+/g,"").replace(/_/g,"").replace(/-/g,"");

      if(clean === "email") return "email";
      if(clean === "x" || clean === "twitter") return "x";
      if(clean === "facebook" || clean === "fb") return "facebook";
      if(clean === "instagram" || clean === "ig") return "instagram";
      if(clean === "whatsapp" || clean === "wa") return "whatsapp";
      if(clean === "threads" || clean === "threats") return "threads"; // tu columna dice THREATS, la acepto igual
      if(clean === "tiktok") return "tiktok";
      if(clean === "snapchat" || clean === "snap") return "snapchat";
      if(clean === "youtube" || clean === "yt") return "youtube";
      if(clean === "twitch") return "twitch";
      if(clean === "telegram" || clean === "tg") return "telegram";
      if(clean === "discord") return "discord";
      if(clean === "github") return "github";
      if(clean === "linkedln" || clean === "linkedin") return "linkedin";
      if(clean === "reddit") return "reddit";
      if(clean === "pinterest") return "pinterest";

      return "generic";
    }

    function parseCSV(text){
      const lines=text.replace(/\r/g,"").split("\n").filter(Boolean);
      const rows=[]; let headers=[];
      for(let i=0;i<lines.length;i++){
        const row=splitCSVLine(lines[i]);
        if(i===0) headers=row.map(h=>normalizeHeader(h));
        else rows.push(row);
      }
      return { headers, rows };
    }

    function splitCSVLine(line){
      const out=[]; let cur=""; let q=false;
      for(let i=0;i<line.length;i++){
        const ch=line[i];
        if(ch === '"' && line[i+1] === '"'){ cur+='"'; i++; continue; }
        if(ch === '"'){ q=!q; continue; }
        if(ch === "," && !q){ out.push(cur); cur=""; continue; }
        cur += ch;
      }
      out.push(cur);
      return out;
    }

    function normalizeHeader(h){
      return String(h||"").trim().toLowerCase()
        .replace(/\s+/g,"_")
        .replace(/[^\w]/g,"");
    }

    function normalizeUrl(u){
      const s=String(u||"").trim();
      if(!s) return "";
      if(/^https?:\/\//i.test(s)) return s;
      if(/^mailto:/i.test(s)) return s;
      return "https://" + s;
    }

    function isValidUrl(u){
      const s=String(u||"").trim();
      if(!s) return false;
      if(/^mailto:/i.test(s)) return true;
      try{ new URL(normalizeUrl(s)); return true; }catch(e){ return false; }
    }

    function sanitizeUsername(u){
      return String(u||"").trim().replace(/^@/,"").replace(/[^\w.-]/g,"").slice(0,40) || "usuario";
    }

    function setAvatar(url){
      const img=document.getElementById("avatarImg");
      img.src=url;
      img.onerror=()=>{ img.src = makeSoulinkFallbackAvatar(); };
    }

    // 🔥 AQUÍ es donde reemplazo por tu logo cuando me lo envíes:
    function makeSoulinkFallbackAvatar(){
      const svg =
        `<svg xmlns="http://www.w3.org/2000/svg" width="240" height="240">
          <defs>
            <radialGradient id="rg" cx="30%" cy="25%" r="75%">
              <stop offset="0" stop-color="rgba(255,255,255,.22)"/>
              <stop offset="1" stop-color="rgba(255,255,255,.05)"/>
            </radialGradient>
            <linearGradient id="lg" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#0f1720"/>
              <stop offset="1" stop-color="#070b10"/>
            </linearGradient>
          </defs>
          <rect width="240" height="240" rx="58" fill="url(#lg)"/>
          <rect width="240" height="240" rx="58" fill="url(#rg)"/>
          <g fill="none" stroke="rgba(233,238,245,.92)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round">
            <path d="M82 122c0-34 26-60 60-60"/>
            <path d="M158 118c0 34-26 60-60 60" opacity=".9"/>
            <path d="M94 120h52" opacity=".9"/>
          </g>
        </svg>`;
      return "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svg);
    }

    function setState(msg){ document.getElementById("state").textContent = msg || ""; }

    function getParam(name){
      try{ return new URL(location.href).searchParams.get(name); }
      catch(e){ return null; }
    }

    /***********************
     * SVG ICONS (redes nuevas incluidas)
     ***********************/
    function svgMail(){ return `<svg viewBox="0 0 24 24" fill="none"><path d="M4 7h16v10H4V7Z" stroke="currentColor" stroke-width="2"/><path d="M4 8l8 6 8-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>`; }
    function svgX(){ return `<svg viewBox="0 0 24 24" fill="none"><path d="M18.2 3H21l-6.6 7.6L22 21h-6.6l-5.2-6.8L4.7 21H2l7.2-8.3L2 3h6.8l4.7 6.2L18.2 3Z" fill="currentColor"/></svg>`; }
    function svgFacebook(){ return `<svg viewBox="0 0 24 24" fill="none"><path d="M14 8h3V5h-3c-2.2 0-4 1.8-4 4v3H7v3h3v6h3v-6h3l1-3h-4V9c0-.6.4-1 1-1Z" fill="currentColor"/></svg>`; }
    function svgInstagram(){ return `<svg viewBox="0 0 24 24" fill="none"><path d="M7.4 2h9.2A5.4 5.4 0 0 1 22 7.4v9.2A5.4 5.4 0 0 1 16.6 22H7.4A5.4 5.4 0 0 1 2 16.6V7.4A5.4 5.4 0 0 1 7.4 2Z" stroke="currentColor" stroke-width="2"/><path d="M12 8.2A3.8 3.8 0 1 0 12 15.8A3.8 3.8 0 0 0 12 8.2Z" stroke="currentColor" stroke-width="2"/><path d="M17.2 6.8h.01" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></svg>`; }
    function svgWhatsApp(){ return `<svg viewBox="0 0 24 24" fill="none"><path d="M12 3.5a8.5 8.5 0 0 0-7.4 12.7L3.5 20.5l4.5-1.1A8.5 8.5 0 1 0 12 3.5Z" stroke="currentColor" stroke-width="2" opacity=".9"/><path d="M9.7 9.5c.2-.3.4-.3.6-.2l.7.4c.2.1.3.3.2.6-.1.3-.2.6-.1.8.2.5 1.1 1.6 2.1 2 .3.1.6.1.8-.1l.5-.5c.2-.2.4-.2.6-.1l.8.4c.2.1.3.3.2.6-.1.5-.5 1.2-1.4 1.3-1.5.2-3.6-1-5-2.6-1.2-1.3-2.2-3.4-2-4.9.1-.9.8-1.2 1-1.4Z" fill="currentColor"/></svg>`; }
    function svgThreads(){ return `<svg viewBox="0 0 24 24" fill="none"><path d="M12 3.5c4.7 0 8.5 3.4 8.5 8.1 0 4.8-3 8.9-8.4 8.9-3.9 0-6.4-2-7.2-5.1-.3-1.1-.2-2.2.1-3.1.8-2.5 3.2-3.7 5.8-3.7 2.5 0 4.6 1.1 5.4 3.1.8 2.2-.2 4.7-3.2 5.6-1.8.5-3.8.2-4.9-1.3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>`; }
    function svgTikTok(){ return `<svg viewBox="0 0 24 24" fill="none"><path d="M14 3v9.2a3.8 3.8 0 1 1-2.6-3.6V3H14Z" fill="currentColor"/><path d="M14 3c1.2 2.4 3.1 3.9 5.6 4.3v2.6c-2.3-.3-4.2-1.4-5.6-3V3Z" fill="currentColor" opacity=".55"/></svg>`; }

    function svgYouTube(){ return `<svg viewBox="0 0 24 24" fill="none"><path d="M21.5 12c0 3.6-.5 5.1-1.4 6-.9.9-2.5 1.1-4.9 1.2H9.8c-2.4-.1-4-.3-4.9-1.2C4 17.1 3.5 15.6 3.5 12s.5-5.1 1.4-6C5.8 5.1 7.4 4.9 9.8 4.8h5.4c2.4.1 4 .3 4.9 1.2.9.9 1.4 2.4 1.4 6Z" fill="currentColor" opacity=".22"/><path d="M10.5 9.5v5l5-2.5-5-2.5Z" fill="currentColor"/></svg>`; }
    function svgTwitch(){ return `<svg viewBox="0 0 24 24" fill="none"><path d="M6 4h15v10l-4 4h-4l-2 2H9v-2H6V4Z" fill="currentColor" opacity=".92"/><path d="M15 8v4M18 8v4" stroke="#05070a" stroke-width="2" stroke-linecap="round" opacity=".55"/></svg>`; }
    function svgTelegram(){ return `<svg viewBox="0 0 24 24" fill="none"><path d="M20.7 5.6 18 19.2c-.2 1-1 .9-1.6.6l-4.6-3.4-2.2 2.1c-.2.2-.4.4-.8.4l.3-5.1 9.3-8.4c.4-.3-.1-.5-.6-.2l-11.5 7.2-5-1.6c-1.1-.3-1.1-1.1.2-1.6l17.7-6.8c.8-.3 1.5.2 1.3 1.2Z" fill="currentColor"/></svg>`; }
