<!doctype html>
<html lang="es" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="theme-color" content="#0b0f14" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>soulink.bio</title>

  <style>
    :root{
      --radius:22px;
      --maxw:520px;

      --bg0:#05070a; --bg1:#0b0f14;
      --card:#0e141b; --card2:#0b1117;
      --text:#e9eef5; --muted:#9aa7b5;
      --stroke:rgba(255,255,255,.10); --stroke2:rgba(255,255,255,.06);
      --shadow:0 18px 60px rgba(0,0,0,.55);
      --grainA:rgba(255,255,255,.06);
      --grainB:rgba(255,255,255,.016);

      --btn:56px;
      --circle:44px;
    }
    html[data-theme="light"]{
      --bg0:#f7f9fb; --bg1:#eef3f7;
      --card:#ffffff; --card2:#f7f9fb;
      --text:#0b0f14; --muted:#566474;
      --stroke:rgba(10,15,20,.14); --stroke2:rgba(10,15,20,.08);
      --shadow:0 18px 50px rgba(0,0,0,.12);
      --grainA:rgba(0,0,0,.05);
      --grainB:rgba(0,0,0,.018);
    }

    *{box-sizing:border-box}
    body{
      margin:0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;
      color:var(--text);
      min-height:100svh;
      background:
        radial-gradient(1200px 650px at 18% 12%, rgba(120,170,255,.14), transparent 55%),
        radial-gradient(900px 520px at 82% 18%, rgba(220,240,255,.18), transparent 50%),
        linear-gradient(160deg, var(--bg0), var(--bg1));
      display:flex;
      align-items:center;
      justify-content:center;
      padding:26px 16px;
      overflow-x:hidden;
    }
    body::before{
      content:"";
      position:fixed; inset:0; pointer-events:none;
      background:
        linear-gradient(115deg, var(--grainA), transparent 35%, rgba(255,255,255,.04) 60%, transparent),
        repeating-linear-gradient(90deg, var(--grainB) 0 1px, transparent 1px 4px);
      mix-blend-mode:overlay;
      opacity:.55;
    }

    .wrap{width:100%; max-width:var(--maxw);}
    .card{
      border-radius:var(--radius);
      border:1px solid var(--stroke2);
      background:
        radial-gradient(700px 240px at 40% 0%, rgba(255,255,255,.10), transparent 50%),
        linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,.02)),
        linear-gradient(180deg, var(--card), var(--card2));
      box-shadow:var(--shadow);
      overflow:hidden;
      backdrop-filter:blur(12px);
      position:relative;
    }

    .topTools{
      position:absolute;
      top:12px; right:12px;
      z-index:5;
    }
    .toggleBtn{
      width:42px; height:42px;
      border-radius:16px;
      border:1px solid var(--stroke2);
      background:linear-gradient(180deg, rgba(255,255,255,.08), rgba(255,255,255,.02));
      color:var(--text);
      box-shadow:0 10px 18px rgba(0,0,0,.18);
      cursor:pointer;
      display:grid;
      place-items:center;
      transition:transform .12s ease, border-color .12s ease;
    }
    .toggleBtn:hover{ transform:translateY(-1px); border-color:rgba(255,255,255,.16); }
    .toggleBtn svg{width:18px;height:18px;display:block}

    .profile{ padding:18px 16px 10px; text-align:center; }
    .username{ margin:0; font-size:22px; line-height:1.05; font-weight:950; letter-spacing:.2px; word-break:break-word; }
    .handle{ margin:6px 0 0; font-size:12.5px; color:var(--muted); }

    .iconsWrap{padding:10px 16px 18px;}
    .icons{ display:grid; grid-template-columns:repeat(4, 1fr); gap:12px; justify-items:center; }
    @media(min-width:420px){
      .icons{ grid-template-columns:repeat(5, 1fr); }
    }

    .iconBtn{
      width:var(--btn);
      height:var(--btn);
      border-radius:18px;
      border:1px solid var(--stroke2);
      background:linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,.02));
      box-shadow:0 12px 22px rgba(0,0,0,.18);
      display:grid;
      place-items:center;
      text-decoration:none;
      transition: transform .12s ease, border-color .12s ease, background .12s ease;
    }
    .iconBtn:hover{
      transform:translateY(-1px);
      border-color: rgba(255,255,255,.16);
      background:linear-gradient(180deg, rgba(255,255,255,.10), rgba(255,255,255,.03));
    }

    /* ✅ aquí es donde se ve EXACTO como tu imagen */
    .iconCircle{
      width:var(--circle);
      height:var(--circle);
      border-radius:999px;
      overflow:hidden;
      background-image: var(--sprite);
      background-repeat:no-repeat;
      background-size: 500% 300%; /* 5 columnas x 3 filas */
      background-position: var(--posX) var(--posY);
      /* por si iOS decide no pintar, verás el borde */
      border: 1px solid rgba(255,255,255,.08);
    }

    .state{padding:0 16px 14px; color:var(--muted); font-size:13px; text-align:center;}
    .footer{padding:14px 16px 16px; color:rgba(154,167,181,.85); font-size:12px; text-align:center;}
  </style>
</head>

<body>
  <div class="wrap">
    <div class="card">
      <div class="topTools">
        <button class="toggleBtn" id="themeBtn" type="button" aria-label="Cambiar tema"></button>
      </div>

      <div class="profile">
        <h1 class="username" id="nameText">@soulink</h1>
        <p class="handle" id="handleText">soulink.bio/@soulink</p>
      </div>

      <div class="iconsWrap">
        <div class="icons" id="icons"></div>
      </div>

      <div class="state" id="state"></div>
      <div class="footer">© soulink.bio</div>
    </div>
  </div>

<script>
const DEFAULT_USERNAME = "soulink";
const SHEETS_CSV_URL =
  "https://docs.google.com/spreadsheets/d/e/2PACX-1vQ8qA-po2EufvnIotOaNgFsvfQqOMOFMR4KyaIGramGsEErGpOzckJYN2nPMvfsdnqoC34w_DawjNdA/pub?output=csv";

// ✅ tu sprite en el repo (sube el archivo a esta ruta)
const SPRITE_URL = "/assets/social-sprite.jpg?v=" + Date.now();

const THEME_KEY = "soulink_theme";
function svgSun(){ return `<svg viewBox="0 0 24 24" fill="none">
  <path d="M12 18a6 6 0 1 0 0-12a6 6 0 0 0 0 12Z" stroke="currentColor" stroke-width="2"/>
  <path d="M12 2v2M12 20v2M4 12H2M22 12h-2M5 5l1.4 1.4M17.6 17.6 19 19M19 5l-1.4 1.4M6.4 17.6 5 19"
    stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
</svg>`; }
function svgMoon(){ return `<svg viewBox="0 0 24 24" fill="none">
  <path d="M21 13.6A8.2 8.2 0 0 1 10.4 3a6.9 6.9 0 1 0 10.6 10.6Z"
    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
</svg>`; }
function getTheme(){ return localStorage.getItem(THEME_KEY) || document.documentElement.getAttribute("data-theme") || "dark"; }
function setTheme(t){
  document.documentElement.setAttribute("data-theme", t);
  localStorage.setItem(THEME_KEY, t);
  document.getElementById("themeBtn").innerHTML = (t === "dark") ? svgMoon() : svgSun();
}
document.getElementById("themeBtn").addEventListener("click", ()=>{
  const cur = getTheme();
  setTheme(cur === "dark" ? "light" : "dark");
});

// posiciones: 3 filas x 5 columnas EXACTO como tu imagen
const POS = {
  x:{x:"0%",y:"0%"},
  facebook:{x:"25%",y:"0%"},
  instagram:{x:"50%",y:"0%"},
  whatsapp:{x:"75%",y:"0%"},
  threads:{x:"100%",y:"0%"},

  tiktok:{x:"0%",y:"50%"},
  snapchat:{x:"25%",y:"50%"},
  youtube:{x:"50%",y:"50%"},
  twitch:{x:"75%",y:"50%"},
  telegram:{x:"100%",y:"50%"},

  discord:{x:"0%",y:"100%"},
  github:{x:"25%",y:"100%"},
  reddit:{x:"50%",y:"100%"},
  pinterest:{x:"75%",y:"100%"},
  email:{x:"100%",y:"100%"},
};

const ORDER = [
  "email","x","facebook","instagram","whatsapp","threads",
  "tiktok","snapchat","youtube","twitch","telegram",
  "discord","github","reddit","pinterest"
];

(async function init(){
  setTheme(getTheme());
  const u = sanitizeUsername(getParam("u") || getUserFromPath() || DEFAULT_USERNAME);
  await loadProfile(u);
})();
window.loadProfile = loadProfile;

async function loadProfile(username){
  const safeU = sanitizeUsername(username);
  renderIcons([]);
  setState("Cargando…");

  document.title = `@${safeU} • soulink.bio`;
  document.getElementById("nameText").textContent = `@${safeU}`;
  document.getElementById("handleText").textContent = `soulink.bio/@${safeU}`;

  try{
    const row = await fetchUserRowFromCSV(SHEETS_CSV_URL + "&v=" + Date.now(), safeU);
    if(!row){
      setState("Este usuario todavía no existe en la base de datos.");
      return;
    }
    const links = extractLinksFromRow(row);
    const sorted = sortLinks(links);
    renderIcons(sorted);
    setState(sorted.length ? "" : "No hay redes sociales guardadas todavía.");
  }catch(e){
    console.error(e);
    renderIcons([]);
    setState("No pude cargar la data. Verifica que el Sheet esté publicado.");
  }
}

function renderIcons(links){
  const box = document.getElementById("icons");
  box.innerHTML = "";

  links.forEach(l=>{
    const a = document.createElement("a");
    a.className = "iconBtn";
    a.href = l.url;
    a.target = "_blank";
    a.rel = "noopener noreferrer";
    a.title = l.type.toUpperCase();

    const c = document.createElement("div");
    c.className = "iconCircle";
    c.style.setProperty("--sprite", `url('${SPRITE_URL}')`);

    const p = POS[l.type] || POS.x;
    c.style.setProperty("--posX", p.x);
    c.style.setProperty("--posY", p.y);

    a.appendChild(c);
    box.appendChild(a);
  });
}

async function fetchUserRowFromCSV(csvUrl, username){
  const res = await fetch(csvUrl, { cache:"no-store" });
  if(!res.ok) throw new Error("CSV fetch failed: " + res.status);
  const text = await res.text();
  const { headers, rows } = parseCSV(text);

  const objs = rows.map(r=>{
    const o={}; headers.forEach((h,i)=> o[h]=(r[i]??"").trim()); return o;
  });

  const key = username.toLowerCase();
  return objs.find(o => (o.username || o.user || o.handle || o.usuario || "").toLowerCase().trim() === key) || null;
}

function extractLinksFromRow(row){
  const links = [];
  for(const k in row){
    const type = normalizeType(k);
    const val = String(row[k]||"").trim();
    if(!val) continue;

    if(type === "email"){
      const mail = val.replace(/^mailto:/i,"").trim();
      if(mail.includes("@")) links.push({ type:"email", url:"mailto:" + mail });
      continue;
    }
    if(ORDER.includes(type)){
      links.push({ type, url: normalizeUrl(val) });
    }
  }
  return links;
}

function sortLinks(links){
  const rank = (t)=> {
    const i = ORDER.indexOf(t);
    return i === -1 ? 999 : i;
  };
  return links.slice().sort((a,b)=> rank(a.type) - rank(b.type));
}

function normalizeType(header){
  const h = String(header||"").trim().toLowerCase();
  const clean = h.replace(/\s+/g,"").replace(/[_-]/g,"");
  if(clean === "threats") return "threads";
  if(clean === "twitter") return "x";
  return clean;
}

function parseCSV(text){
  const lines=text.replace(/\r/g,"").split("\n").filter(Boolean);
  const rows=[]; let headers=[];
  for(let i=0;i<lines.length;i++){
    const row=splitCSVLine(lines[i]);
    if(i===0) headers=row.map(h=>String(h||"").trim().toLowerCase());
    else rows.push(row);
  }
  return { headers, rows };
}
function splitCSVLine(line){
  const out=[]; let cur=""; let q=false;
  for(let i=0;i<line.length;i++){
    const ch=line[i];
    if(ch === '"' && line[i+1] === '"'){ cur+='"'; i++; continue; }
    if(ch === '"'){ q=!q; continue; }
    if(ch === "," && !q){ out.push(cur); cur=""; continue; }
    cur += ch;
  }
  out.push(cur);
  return out;
}

function normalizeUrl(u){
  const s=String(u||"").trim();
  if(!s) return "";
  if(/^https?:\/\//i.test(s)) return s;
  return "https://" + s;
}
function sanitizeUsername(u){
  return String(u||"").trim().replace(/^@/,"").replace(/[^\w.-]/g,"").slice(0,40) || "usuario";
}
function setState(msg){ document.getElementById("state").textContent = msg || ""; }
function getParam(name){ try{ return new URL(location.href).searchParams.get(name); } catch(e){ return null; } }
function getUserFromPath(){
  try{
    const path = decodeURIComponent(location.pathname || "/");
    const m = path.match(/^\/@([^\/?#]+)/);
    return m ? m[1].replace(/^@/,"") : null;
  }catch(e){ return null; }
}
</script>
</body>
</html>
