<!doctype html>
<html lang="es" data-theme="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<meta name="theme-color" content="#0b0f14" />
<title>soulink.bio</title>

<style>
:root{
  --bg0:#05070a; --bg1:#0b0f14;
  --card:#0e141b; --card2:#0b1117;
  --text:#e9eef5; --muted:#9aa7b5;
  --stroke:rgba(255,255,255,.10); --stroke2:rgba(255,255,255,.06);
  --shadow:0 18px 60px rgba(0,0,0,.55);
  --radius:22px; --maxw:540px;
}
html[data-theme="light"]{
  --bg0:#f7f9fb; --bg1:#eef3f7;
  --card:#ffffff; --card2:#f7f9fb;
  --text:#0b0f14; --muted:#566474;
  --stroke:rgba(10,15,20,.14); --stroke2:rgba(10,15,20,.08);
  --shadow:0 18px 50px rgba(0,0,0,.12);
}
*{box-sizing:border-box}
body{
  margin:0;
  font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial;
  color:var(--text);
  min-height:100svh;
  background:
    radial-gradient(1200px 650px at 18% 12%, rgba(120,170,255,.14), transparent 55%),
    radial-gradient(900px 520px at 82% 18%, rgba(220,240,255,.18), transparent 50%),
    linear-gradient(160deg, var(--bg0), var(--bg1));
}
.wrap{max-width:var(--maxw); margin:0 auto; padding:26px 16px;}
.card{
  border-radius:var(--radius);
  border:1px solid var(--stroke2);
  background:linear-gradient(180deg, var(--card), var(--card2));
  box-shadow:var(--shadow);
  position:relative;
}
.topTools{position:absolute;top:12px;right:12px;}
.toggleBtn{
  width:36px;height:36px;border-radius:12px;
  border:1px solid var(--stroke2);background:transparent;
  color:var(--text);cursor:pointer;
}
.profile{text-align:center;padding:26px 18px 6px;}
.username{margin:0;font-size:22px;font-weight:900;}
.handle{margin:4px 0 0;font-size:12px;color:var(--muted);}

.iconsWrap{padding:18px;}
.icons{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;}
@media(max-width:420px){.icons{grid-template-columns:repeat(4,1fr);}}

/* ICONOS CIRCULARES */
.iconBtn{
  width:64px;height:64px;border-radius:999px;
  display:grid;place-items:center;
  text-decoration:none;
  background:var(--bgColor,#111827);
  transition:.15s;
  box-shadow:
    0 10px 22px rgba(0,0,0,.25),
    inset 0 0 0 1px rgba(255,255,255,.08);
}
html[data-theme="light"] .iconBtn{
  box-shadow:
    0 10px 22px rgba(0,0,0,.12),
    inset 0 0 0 1px rgba(10,15,20,.08);
}
.iconBtn:hover{transform:translateY(-2px);filter:brightness(1.06);}
.iconBtn:active{transform:scale(.96);}
.iconBtn svg{
  width:28px;height:28px;
  color:var(--fgColor,#fff);
}

.state{text-align:center;font-size:13px;color:var(--muted);}
.footer{text-align:center;font-size:12px;color:var(--muted);padding:14px;}
</style>
</head>

<body>
<div class="wrap">
<div class="card">
  <div class="topTools">
    <button class="toggleBtn" id="themeBtn">🌓</button>
  </div>

  <div class="profile">
    <h1 class="username" id="nameText">@soulink</h1>
    <p class="handle" id="handleText">soulink.bio/@soulink</p>
  </div>

  <div class="iconsWrap">
    <div class="icons" id="icons"></div>
  </div>

  <div class="state" id="state"></div>
  <div class="footer">© soulink.bio</div>
</div>
</div>

<script>
const DEFAULT_USERNAME="soulink";
const SHEETS_CSV_URL="https://docs.google.com/spreadsheets/d/e/2PACX-1vQ8qA-po2EufvnIotOaNgFsvfQqOMOFMR4KyaIGramGsEErGpOzckJYN2nPMvfsdnqoC34w_DawjNdA/pub?output=csv";

/* COLORES */
const BRAND_BG={
 email:"#6b7280",x:"#000",facebook:"#1877F2",instagram:"#E1306C",
 whatsapp:"#25D366",threads:"#000",tiktok:"#000",snapchat:"#FFFC00",
 youtube:"#FF0000",twitch:"#9146FF",telegram:"#229ED9",
 discord:"#5865F2",github:"#111827",linkedin:"#0A66C2",
 reddit:"#FF4500",pinterest:"#E60023"
};
const BRAND_FG={snapchat:"#000"};

const ICONS={
 email:`<svg viewBox="0 0 24 24"><path d="M4 7h16v10H4z" fill="none" stroke="currentColor" stroke-width="2"/><path d="M4 8l8 6 8-6" stroke="currentColor" stroke-width="2"/></svg>`,
 x:`<svg viewBox="0 0 24 24"><path d="M18.2 3H21l-6.6 7.6L22 21h-6.6l-5.2-6.8L4.7 21H2l7.2-8.3L2 3h6.8l4.7 6.2Z" fill="currentColor"/></svg>`,
 facebook:`<svg viewBox="0 0 24 24"><path d="M14 8h3V5h-3c-2.2 0-4 1.8-4 4v3H7v3h3v6h3v-6h3l1-3h-4V9c0-.6.4-1 1-1Z" fill="currentColor"/></svg>`,
 instagram:`<svg viewBox="0 0 24 24" fill="none"><rect x="2" y="2" width="20" height="20" rx="6" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="12" r="4" stroke="currentColor" stroke-width="2"/></svg>`,
 whatsapp:`<svg viewBox="0 0 24 24"><path d="M12 3.5a8.5 8.5 0 0 0-7.4 12.7L3.5 20.5l4.5-1.1A8.5 8.5 0 1 0 12 3.5Z" fill="none" stroke="currentColor" stroke-width="2"/><path d="M9.7 9.5c.2-.3.4-.3.6-.2l.7.4c.2.1.3.3.2.6-.1.3-.2.6-.1.8.2.5 1.1 1.6 2.1 2 .3.1.6.1.8-.1l.5-.5c.2-.2.4-.2.6-.1l.8.4c.2.1.3.3.2.6-.1.5-.5 1.2-1.4 1.3-1.5.2-3.6-1-5-2.6Z" fill="currentColor"/></svg>`,
 threads:`<svg viewBox="0 0 24 24"><path d="M12 3.5c4.7 0 8.5 3.4 8.5 8.1 0 4.8-3 8.9-8.4 8.9-3.9 0-6.4-2-7.2-5.1" fill="none" stroke="currentColor" stroke-width="2"/></svg>`
};

const ORDER=["email","x","facebook","instagram","whatsapp","threads","tiktok","snapchat","youtube","twitch","telegram","discord","github","linkedin","reddit","pinterest"];

document.addEventListener("DOMContentLoaded",init);

function getUser(){
  const m=location.pathname.match(/^\/@([^\/?#]+)/);
  return (m?m[1]:DEFAULT_USERNAME).replace("@","");
}

async function init(){
  const u=getUser();
  nameText.textContent="@"+u;
  handleText.textContent="soulink.bio/@"+u;
  loadLinks(u);
}

async function loadLinks(u){
  state.textContent="Cargando…";
  const res=await fetch(SHEETS_CSV_URL,{cache:"no-store"});
  const txt=await res.text();
  const lines=txt.split("\n").map(l=>l.split(","));
  const headers=lines[0];
  const row=lines.find(r=>(r[headers.indexOf("username")]||"").toLowerCase()===u.toLowerCase());
  if(!row){state.textContent="Usuario no encontrado";return;}
  icons.innerHTML="";
  ORDER.forEach(type=>{
    const i=headers.indexOf(type);
    if(i===-1||!row[i])return;
    const a=document.createElement("a");
    a.className="iconBtn";
    a.href=row[i].startsWith("http")?row[i]:"https://"+row[i];
    a.target="_blank";
    a.style.setProperty("--bgColor",BRAND_BG[type]||"#111");
    a.style.setProperty("--fgColor",BRAND_FG[type]||"#fff");
    a.innerHTML=ICONS[type]||"";
    icons.appendChild(a);
  });
  state.textContent="";
}

themeBtn.onclick=()=>{
  document.documentElement.dataset.theme=
    document.documentElement.dataset.theme==="dark"?"light":"dark";
};
</script>
</body>
</html>
