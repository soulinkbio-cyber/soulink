<!doctype html>
<html lang="es" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="theme-color" content="#0b0f14" />
  <title>soulink.bio</title>

  <style>
    :root{
      --radius:22px;
      --avatar:92px;
      --maxw:540px;

      /* Dark */
      --bg0:#05070a; --bg1:#0b0f14;
      --card:#0e141b; --card2:#0b1117;
      --text:#e9eef5; --muted:#9aa7b5;
      --stroke:rgba(255,255,255,.10); --stroke2:rgba(255,255,255,.06);
      --shadow:0 18px 60px rgba(0,0,0,.55);
      --grainA:rgba(255,255,255,.06);
      --grainB:rgba(255,255,255,.016);
    }

    html[data-theme="light"]{
      --bg0:#f7f9fb; --bg1:#eef3f7;
      --card:#ffffff; --card2:#f7f9fb;
      --text:#0b0f14; --muted:#566474;
      --stroke:rgba(10,15,20,.14); --stroke2:rgba(10,15,20,.08);
      --shadow:0 18px 50px rgba(0,0,0,.12);
      --grainA:rgba(0,0,0,.05);
      --grainB:rgba(0,0,0,.018);
    }

    *{box-sizing:border-box}
    body{
      margin:0;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;
      color:var(--text);
      min-height:100svh;
      background:
        radial-gradient(1200px 650px at 18% 12%, rgba(220,240,255,.10), transparent 55%),
        radial-gradient(900px 520px at 82% 18%, rgba(120,170,255,.10), transparent 50%),
        radial-gradient(900px 520px at 50% 90%, rgba(255,255,255,.06), transparent 52%),
        linear-gradient(160deg, var(--bg0), var(--bg1) 55%, var(--bg0));
      overflow-x:hidden;
    }

    body::before{
      content:"";
      position:fixed; inset:0; pointer-events:none;
      background:
        linear-gradient(115deg, var(--grainA), transparent 35%, rgba(255,255,255,.04) 60%, transparent),
        repeating-linear-gradient(90deg, var(--grainB) 0 1px, transparent 1px 4px);
      mix-blend-mode:overlay;
      opacity:.55;
    }

    .wrap{max-width:var(--maxw); margin:0 auto; padding:28px 16px 26px;}

    .card{
      border-radius:var(--radius);
      border:1px solid var(--stroke2);
      background:
        radial-gradient(700px 240px at 40% 0%, rgba(255,255,255,.10), transparent 50%),
        linear-gradient(180deg, rgba(255,255,255,.05), rgba(255,255,255,.02)),
        linear-gradient(180deg, var(--card), var(--card2));
      box-shadow:var(--shadow);
      overflow:hidden;
      backdrop-filter:blur(12px);
      position:relative;
    }

    /* Toggle arriba (solo ícono) */
    .topTools{
      position:absolute;
      top:12px; right:12px;
      z-index:5;
    }
    .toggleBtn{
      width:40px; height:40px;
      border-radius:14px;
      border:1px solid var(--stroke2);
      background:linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,.02));
      color:var(--text);
      box-shadow:0 10px 18px rgba(0,0,0,.18);
      cursor:pointer;
      display:grid; place-items:center;
      user-select:none;
      transition:transform .12s ease, border-color .12s ease;
    }
    .toggleBtn:hover{ transform:translateY(-1px); border-color:rgba(255,255,255,.14); }
    .toggleBtn svg{width:18px;height:18px;display:block}

    .profile{
      padding:22px 18px 14px;
      display:flex;
      flex-direction:column;
      align-items:center;
      gap:12px;
      text-align:center;
    }

    .avatar{
      width:var(--avatar);
      height:var(--avatar);
      border-radius:26px;
      background:linear-gradient(180deg, rgba(255,255,255,.10), rgba(255,255,255,.04));
      border:1px solid var(--stroke);
      box-shadow:0 16px 32px rgba(0,0,0,.45);
      overflow:hidden;
      position:relative;
    }
    .avatar::after{
      content:"";
      position:absolute; inset:-1px;
      border-radius:26px;
      border:1px solid rgba(255,255,255,.08);
      pointer-events:none;
    }
    .avatar img{width:100%; height:100%; object-fit:cover; display:block;}

    .username{
      margin:0;
      font-size:24px;
      line-height:1.05;
      font-weight:950;
      letter-spacing:.2px;
      word-break:break-word;
    }

    .handle{
      margin:0;
      font-size:13px;
      color:var(--muted);
    }

    .iconsWrap{padding:10px 16px 18px;}
    .icons{
      display:grid;
      grid-template-columns: repeat(5, 1fr);
      gap:12px;
    }
    @media (max-width: 420px){
      .icons{grid-template-columns: repeat(4, 1fr);}
    }

    /* Cuadrado */
    .iconBtn{
      height:54px;
      border-radius:18px;
      border:1px solid var(--stroke2);
      background:linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,.02));
      box-shadow:0 12px 22px rgba(0,0,0,.30);
      display:grid;
      place-items:center;
      text-decoration:none;
      position:relative;
      overflow:hidden;
      transition: transform .12s ease, border-color .12s ease, background .12s ease;
    }
    .iconBtn:hover{
      transform: translateY(-1px);
      border-color: rgba(255,255,255,.14);
      background:linear-gradient(180deg, rgba(255,255,255,.10), rgba(255,255,255,.03));
    }

    /* “Bola” dentro */
    .iconCircle{
      width:34px; height:34px;
      border-radius:999px;
      display:grid;
      place-items:center;
      background: var(--circleBg, rgba(233,238,245,.12));
      box-shadow: 0 10px 18px rgba(0,0,0,.22);
      border:1px solid rgba(255,255,255,.10);
    }
    html[data-theme="light"] .iconCircle{
      border:1px solid rgba(10,15,20,.10);
      box-shadow: 0 10px 18px rgba(0,0,0,.10);
    }

    .iconCircle svg{
      width:18px; height:18px;
      display:block;
      color: var(--iconFg, #fff);
    }

    .state{padding:0 16px 16px; color:var(--muted); font-size:13px; text-align:center;}
    .footer{padding:14px 16px 16px; color:rgba(154,167,181,.85); font-size:12px; text-align:center;}
  </style>
</head>

<body>
  <div class="wrap">
    <div class="card">

      <div class="topTools">
        <button class="toggleBtn" id="themeBtn" type="button" aria-label="Cambiar tema"></button>
      </div>

      <div class="profile">
        <div class="avatar"><img id="avatarImg" alt="Avatar" /></div>
        <h1 class="username" id="nameText">@soulink</h1>
        <p class="handle" id="handleText">soulink.bio/@soulink</p>
      </div>

      <div class="iconsWrap">
        <div class="icons" id="icons"></div>
      </div>

      <div class="state" id="state"></div>
      <div class="footer">© soulink.bio</div>
    </div>
  </div>

  <script>
    const DEFAULT_USERNAME = "soulink";

    const SHEETS_CSV_URL =
      "https://docs.google.com/spreadsheets/d/e/2PACX-1vQ8qA-po2EufvnIotOaNgFsvfQqOMOFMR4KyaIGramGsEErGpOzckJYN2nPMvfsdnqoC34w_DawjNdA/pub?output=csv";

    // ✅ Tu logo real (el que me enviaste). Súbelo al root:
    // https://soulink.bio/soulink-logo.jpg
    const FALLBACK_AVATAR_URL = "/soulink-logo.jpg";

    // Tema
    initThemeToggle();

    // “Bola” estilo por red (background círculo + color icono)
    const CIRCLE = {
      email:     { bg:"#111827", fg:"#ffffff" },
      x:         { bg:"#000000", fg:"#ffffff" },
      facebook:  { bg:"#1877F2", fg:"#ffffff" },
      instagram: { bg:"#E1306C", fg:"#ffffff" },
      whatsapp:  { bg:"#25D366", fg:"#ffffff" },
      threads:   { bg:"#000000", fg:"#ffffff" },
      tiktok:    { bg:"#000000", fg:"#ffffff" },
      snapchat:  { bg:"#FFFC00", fg:"#000000" },
      youtube:   { bg:"#FF0033", fg:"#ffffff" },
      twitch:    { bg:"#9146FF", fg:"#ffffff" },
      telegram:  { bg:"#26A5E4", fg:"#ffffff" },
      discord:   { bg:"#5865F2", fg:"#ffffff" },
      github:    { bg:"#111827", fg:"#ffffff" },
      linkedin:  { bg:"#0A66C2", fg:"#ffffff" },
      reddit:    { bg:"#FF4500", fg:"#ffffff" },
      pinterest: { bg:"#E60023", fg:"#ffffff" },
      generic:   { bg:"#111827", fg:"#ffffff" },
    };

    const ICONS = {
      email: svgMail(),
      x: svgX(),
      facebook: svgFacebook(),
      instagram: svgInstagram(),
      whatsapp: svgWhatsApp(),
      threads: svgThreads(),
      tiktok: svgTikTok(),
      snapchat: svgSnapchat(),
      youtube: svgYouTube(),
      twitch: svgTwitch(),
      telegram: svgTelegram(),
      discord: svgDiscord(),
      github: svgGithub(),
      linkedin: svgLinkedIn(),
      reddit: svgReddit(),
      pinterest: svgPinterest(),
      generic: svgGeneric(),
    };

    const ORDER = [
      "email","x","facebook","instagram","whatsapp","threads","tiktok","snapchat",
      "youtube","twitch","telegram","discord","github","linkedin","reddit","pinterest"
    ];

    (async function init(){
      const u = getParam("u") || DEFAULT_USERNAME;
      await loadProfile(u);
    })();

    window.loadProfile = loadProfile;

    async function loadProfile(username){
      setState("Cargando…");
      const safeU = sanitizeUsername(username);
      document.title = `@${safeU} • soulink.bio`;
      document.getElementById("nameText").textContent = `@${safeU}`;
      document.getElementById("handleText").textContent = `soulink.bio/@${safeU}`;

      // fallback = logo Soulink
      setAvatar(FALLBACK_AVATAR_URL);

      try{
        const row = await fetchUserRowFromCSV(SHEETS_CSV_URL, safeU);
        if(!row){
          renderIcons([]);
          setState("Este usuario todavía no existe en la base de datos.");
          return;
        }

        // ✅ Avatar: reconoce muchas columnas + normaliza URL
        const avatar =
          row.avatar || row.avatar_url || row.pfp || row.profile_picture || row.profilepicture ||
          row.profile_photo || row.photo || row.picture || row.image || row.profile || "";

        if(avatar) setAvatar(avatar);

        const links = extractLinksFromRow(row);
        const sorted = sortLinks(links);

        renderIcons(sorted);
        setState(sorted.length ? "" : "No hay redes sociales guardadas todavía.");
      }catch(e){
        console.error(e);
        renderIcons([]);
        setState("No pude cargar la data. Verifica que el Sheet esté publicado.");
      }
    }

    function renderIcons(links){
      const box = document.getElementById("icons");
      box.innerHTML = "";

      links.forEach(l=>{
        const a = document.createElement("a");
        a.className = "iconBtn";
        a.href = l.url;
        a.target = "_blank";
        a.rel = "noopener noreferrer";
        a.title = l.type.toUpperCase();

        const style = CIRCLE[l.type] || CIRCLE.generic;

        const circle = document.createElement("div");
        circle.className = "iconCircle";
        circle.style.setProperty("--circleBg", style.bg);
        circle.style.setProperty("--iconFg", style.fg);
        circle.innerHTML = ICONS[l.type] || ICONS.generic;

        box.appendChild(a);
        a.appendChild(circle);
      });
    }

    function setAvatar(url){
      const img=document.getElementById("avatarImg");
      const finalUrl = normalizeImageUrl(url);
      // cache-bust por si actualizan la foto
      img.src = finalUrl ? (finalUrl + (finalUrl.includes("?") ? "&" : "?") + "v=" + Date.now()) : FALLBACK_AVATAR_URL;
      img.onerror = ()=>{ img.src = FALLBACK_AVATAR_URL; };
    }

    // ✅ Acepta links de Drive/Dropbox, URLs sin protocolo, y rutas locales (/uploads/..)
    function normalizeImageUrl(url){
      const s = String(url||"").trim();
      if(!s) return "";

      // rutas locales
      if(s.startsWith("/")) return s;

      // si ya es url directa
      if(/^https?:\/\//i.test(s)) {
        return convertKnownHosts(s);
      }

      // si viene como "soulink.bio/..."
      if(/^soulink\.bio\//i.test(s)) {
        return "https://" + s;
      }

      // si viene solo "www..."
      if(/^www\./i.test(s)) {
        return "https://" + s;
      }

      // default
      return convertKnownHosts("https://" + s);
    }

    function convertKnownHosts(u){
      const s = String(u||"");

      // Google Drive: /file/d/ID/
      const m1 = s.match(/drive\.google\.com\/file\/d\/([^\/]+)/i);
      if(m1) return `https://drive.google.com/uc?export=view&id=${m1[1]}`;

      // Google Drive: open?id=ID
      const m2 = s.match(/drive\.google\.com\/open\?id=([^&]+)/i);
      if(m2) return `https://drive.google.com/uc?export=view&id=${m2[1]}`;

      // Google Drive: uc?id=ID
      const m3 = s.match(/drive\.google\.com\/uc\?id=([^&]+)/i);
      if(m3) return `https://drive.google.com/uc?export=view&id=${m3[1]}`;

      // Dropbox: dl=0 -> raw=1
      if(/dropbox\.com/i.test(s)) {
        const url = new URL(s);
        url.searchParams.delete("dl");
        url.searchParams.set("raw","1");
        return url.toString();
      }

      return s;
    }

    async function fetchUserRowFromCSV(csvUrl, username){
      const res = await fetch(csvUrl, { cache:"no-store" });
      if(!res.ok) throw new Error("CSV fetch failed: " + res.status);
      const text = await res.text();
      const { headers, rows } = parseCSV(text);

      const objs = rows.map(r=>{
        const o={}; headers.forEach((h,i)=> o[h]=(r[i]??"").trim()); return o;
      });

      const key = username.toLowerCase();
      return objs.find(o => (o.username || o.user || o.handle || "").toLowerCase() === key) || null;
    }

    function extractLinksFromRow(row){
      const links = [];
      for(const k in row){
        const rawKey = String(k||"");
        const key = normalizeHeader(rawKey);
        const val = String(row[k]||"").trim();
        if(!val) continue;

        if(["username","user","handle","avatar","avatar_url","pfp","profile_picture","profilepicture","profile_photo","photo","picture","image","profile","display_name","name"].includes(key)) continue;

        if(isValidValue(val, rawKey)){
          const type = normalizeType(rawKey);
          links.push({ type, url: normalizeUrl(val, type) });
        }
      }

      const seen = new Set();
      return links.filter(l=>{
        if(seen.has(l.url)) return false;
        seen.add(l.url);
        return true;
      });
    }

    function sortLinks(links){
      const rank = (t)=> {
        const i = ORDER.indexOf(t);
        return i === -1 ? 999 : i;
      };
      return links.slice().sort((a,b)=> rank(a.type) - rank(b.type));
    }

    function normalizeType(header){
      const h = String(header||"").trim().toLowerCase();
      const clean = h.replace(/\s+/g,"").replace(/_/g,"").replace(/-/g,"");

      if(clean === "email") return "email";
      if(clean === "x" || clean === "twitter") return "x";
      if(clean === "facebook" || clean === "fb") return "facebook";
      if(clean === "instagram" || clean === "ig") return "instagram";
      if(clean === "whatsapp" || clean === "wa") return "whatsapp";
      if(clean === "threads" || clean === "threats") return "threads";
      if(clean === "tiktok") return "tiktok";
      if(clean === "snapchat" || clean === "snap") return "snapchat";
      if(clean === "youtube" || clean === "yt") return "youtube";
      if(clean === "twitch") return "twitch";
      if(clean === "telegram" || clean === "tg") return "telegram";
      if(clean === "discord") return "discord";
      if(clean === "github") return "github";
      if(clean === "linkedln" || clean === "linkedin") return "linkedin";
      if(clean === "reddit") return "reddit";
      if(clean === "pinterest") return "pinterest";

      return "generic";
    }

    function parseCSV(text){
      const lines=text.replace(/\r/g,"").split("\n").filter(Boolean);
      const rows=[]; let headers=[];
      for(let i=0;i<lines.length;i++){
        const row=splitCSVLine(lines[i]);
        if(i===0) headers=row.map(h=>normalizeHeader(h));
        else rows.push(row);
      }
      return { headers, rows };
    }

    function splitCSVLine(line){
      const out=[]; let cur=""; let q=false;
      for(let i=0;i<line.length;i++){
        const ch=line[i];
        if(ch === '"' && line[i+1] === '"'){ cur+='"'; i++; continue; }
        if(ch === '"'){ q=!q; continue; }
        if(ch === "," && !q){ out.push(cur); cur=""; continue; }
        cur += ch;
      }
      out.push(cur);
      return out;
    }

    function normalizeHeader(h){
      return String(h||"").trim().toLowerCase()
        .replace(/\s+/g,"_")
        .replace(/[^\w]/g,"");
    }

    function normalizeUrl(u, type){
      const s=String(u||"").trim();
      if(!s) return "";

      if(type === "email"){
        if(/^mailto:/i.test(s)) return s;
        return "mailto:" + s.replace(/\s+/g,"");
      }

      if(/^https?:\/\//i.test(s)) return s;
      return "https://" + s;
    }

    function isValidValue(val, header){
      const s = String(val||"").trim();
      if(!s) return false;

      // email simple
      const key = String(header||"").toLowerCase();
      if(key.includes("email") && s.includes("@")) return true;

      // url
      try{ new URL(normalizeUrl(s,"generic")); return true; }catch(e){ return false; }
    }

    function sanitizeUsername(u){
      return String(u||"").trim().replace(/^@/,"").replace(/[^\w.-]/g,"").slice(0,40) || "usuario";
    }

    function setState(msg){ document.getElementById("state").textContent = msg || ""; }

    function getParam(name){
      try{ return new URL(location.href).searchParams.get(name); }
      catch(e){ return null; }
    }

    function initThemeToggle(){
      const saved = localStorage.getItem("soulink_theme");
      if(saved === "light" || saved === "dark"){
        document.documentElement.setAttribute("data-theme", saved);
      }else{
        document.documentElement.setAttribute("data-theme", "dark");
      }

      const btn = document.getElementById("themeBtn");
      const paint = ()=>{
        const t = document.documentElement.getAttribute("data-theme") || "dark";
        btn.innerHTML = (t === "dark") ? sunSvg() : moonSvg();
        // meta theme-color
        const meta = document.querySelector('meta[name="theme-color"]');
        if(meta) meta.setAttribute("content", (t==="dark") ? "#0b0f14" : "#eef3f7");
      };
      paint();

      btn.addEventListener("click", ()=>{
        const t = document.documentElement.getAttribute("data-theme") || "dark";
        const next = (t === "dark") ? "light" : "dark";
        document.documentElement.setAttribute("data-theme", next);
        localStorage.setItem("soulink_theme", next);
        paint();
      });
    }

    function sunSvg(){ return `<svg viewBox="0 0 24 24" fill="none"><path d="M12 18a6 6 0 1 0 0-12 6 6 0 0 0 0 12Z" stroke="currentColor" stroke-width="2"/><path d="M12 2v2M12 20v2M4 12H2M22 12h-2M5 5l1.5 1.5M17.5 17.5 19 19M19 5l-1.5 1.5M5 19l1.5-1.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>`; }
    function moonSvg(){ return `<svg viewBox="0 0 24 24" fill="none"><path d="M21 13.2A7.5 7.5 0 0 1 10.8 3a6.5 6.5 0 1 0 10.2 10.2Z" fill="currentColor" opacity=".9"/></svg>`; }

    /* SVG logos (adentro de la bola) */
    function svgMail(){ return `<svg viewBox="0 0 24 24" fill="none"><path d="M4 7h16v10H4V7Z" stroke="currentColor" stroke-width="2"/><path d="M4 8l8 6 8-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>`; }
    function svgX(){ return `<svg viewBox="0 0 24 24" fill="none"><path d="M18.2 3H21l-6.6 7.6L22 21h-6.6l-5.2-6.8L4.7 21H2l7.2-8.3L2 3h6.8l4.7 6.2L18.2 3Z" fill="currentColor"/></svg>`; }
    function svgFacebook(){ return `<svg viewBox="0 0 24 24" fill="none"><path d="M14 8h3V5h-3c-2.2 0-4 1.8-4 4v3H7v3h3v6h3v-6h3l1-3h-4V9c0-.6.4-1 1-1Z" fill="currentColor"/></svg>`; }
    function svgInstagram(){ return `<svg viewBox="0 0 24 24" fill="none"><path d="M7.4 2h9.2A5.4 5.4 0 0 1 22 7.4v9.2A5.4 5.4 0 0 1 16.6 22H7.4A5.4 5.4 0 0 1 2 16.6V7.4A5.4 5.4 0 0 1 7.4 2Z" stroke="currentColor" stroke-width="2"/><path d="M12 8.2A3.8 3.8 0 1 0 12 15.8A3.8 3.8 0 0 0 12 8.2Z" stroke="currentColor" stroke-width="2"/><path d="M17.2 6.8h.01" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></svg>`; }
    function svgWhatsApp(){ return `<svg viewBox="0 0 24 24" fill="none"><path d="M12 3.5a8.5 8.5 0 0 0-7.4 12.7L3.5 20.5l4.5-1.1A8.5 8.5 0 1 0 12 3.5Z" stroke="currentColor" stroke-width="2" opacity=".9"/><path d="M9.7 9.5c.2-.3.4-.3.6-.2l.7.4c.2.1.3.3.2.6-.1.3-.2.6-.1.8.2.5 1.1 1.6 2.1 2 .3.1.6.1.8-.1l.5-.5c.2-.2.4-.2.6-.1l.8.4c.2.1.3.3.2.6-.1.5-.5 1.2-1.4 1.3-1.5.2-3.6-1-5-2.6-1.2-1.3-2.2-3.4-2-4.9.1-.9.8-1.2 1-1.4Z" fill="currentColor"/></svg>`; }
