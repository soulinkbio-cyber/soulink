<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Soulink • Perfil</title>

<!-- Evitar cache agresivo (Safari) -->
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
<meta http-equiv="Pragma" content="no-cache" />
<meta http-equiv="Expires" content="0" />

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
:root { --bg:#fff; --text:#111; --muted:#666; }
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Inter', -apple-system, system-ui, sans-serif;
  background: var(--bg); color: var(--text);
  display:flex; justify-content:center; align-items:center; min-height:100vh;
}
.wrap { width:100%; max-width:420px; text-align:center; padding:30px 18px; }
.avatar {
  width:130px; height:130px; border-radius:50%; object-fit:cover;
  border:2px solid #ddd; margin-bottom:14px;
}
.uname { font-size:22px; font-weight:700; margin-bottom:22px; }
.links { display:flex; justify-content:center; flex-wrap:wrap; gap:16px; }

.link-btn {
  display:flex; align-items:center; justify-content:center;
  width:58px; height:58px; border-radius:50%; color:#fff;
  text-decoration:none; font-size:24px;
  transition: transform .2s, opacity .2s;
}
.link-btn:hover { transform:scale(1.08); opacity:.92; }

.x  { background:#000; }
.fb { background:#1877f2; }
.ig { background:#d62976; }
.wa { background:#25d366; }
.th { background:#000; } 
.tt { background:#000; }
.sc { background:#fffc00; color:#000; }
.yt { background:#ff0000; }
.tw { background:#6441a5; }
.tg { background:#229ED9; }
.dc { background:#5865F2; }
.gh { background:#24292e; }
.li { background:#0a66c2; }
.rd { background:#ff4500; }
.pi { background:#bd081c; }
.em { background:#6d6d6d; }

.foot { margin-top:28px; color:#aaa; font-size:12px; }
</style>
</head>

<body>
<div class="wrap">
  <img id="avatar" class="avatar" src="" alt="avatar" />
  <div id="uname" class="uname">@usuario</div>

  <div class="links">
    <a id="btn-x"   class="link-btn x"   target="_blank" style="display:none"><i class="fab fa-x-twitter"></i></a>
    <a id="btn-fb"  class="link-btn fb"  target="_blank" style="display:none"><i class="fab fa-facebook-f"></i></a>
    <a id="btn-ig"  class="link-btn ig"  target="_blank" style="display:none"><i class="fab fa-instagram"></i></a>
    <a id="btn-wa"  class="link-btn wa"  target="_blank" style="display:none"><i class="fab fa-whatsapp"></i></a>
    <a id="btn-th"  class="link-btn th"  target="_blank" style="display:none"><i class="fab fa-threads"></i></a>
    <a id="btn-tt"  class="link-btn tt"  target="_blank" style="display:none"><i class="fab fa-tiktok"></i></a>
    <a id="btn-sc"  class="link-btn sc"  target="_blank" style="display:none"><i class="fab fa-snapchat-ghost"></i></a>
    <a id="btn-yt"  class="link-btn yt"  target="_blank" style="display:none"><i class="fab fa-youtube"></i></a>
    <a id="btn-tw"  class="link-btn tw"  target="_blank" style="display:none"><i class="fab fa-twitch"></i></a>
    <a id="btn-tg"  class="link-btn tg"  target="_blank" style="display:none"><i class="fab fa-telegram_plane"></i></a>
    <a id="btn-dc"  class="link-btn dc"  target="_blank" style="display:none"><i class="fab fa-discord"></i></a>
    <a id="btn-gh"  class="link-btn gh"  target="_blank" style="display:none"><i class="fab fa-github"></i></a>
    <a id="btn-li"  class="link-btn li"  target="_blank" style="display:none"><i class="fab fa-linkedin-in"></i></a>
    <a id="btn-rd"  class="link-btn rd"  target="_blank" style="display:none"><i class="fab fa-reddit-alien"></i></a>
    <a id="btn-pi"  class="link-btn pi"  target="_blank" style="display:none"><i class="fab fa-pinterest-p"></i></a>

    <a id="btn-em"  class="link-btn em"  style="display:none"><i class="fas fa-envelope"></i></a>
  </div>

  <div class="foot">© Soulink NFC</div>
</div>

<script>
// =========================================================
// CONFIG
// =========================================================
const SHEET_TSV = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQ8qA-po2EufvnIotOaNgFsvfQqOMOFMR4KyaIGramGsEErGpOzckJYN2nPMvfsdnqoC34w_DawjNdA/pub?output=tsv&gid=0";

// Perfil oficial si no existe el usuario o falla el avatar
const OFFICIAL = {
  USERNAME: "soulink",
  AVATAR: "https://i.imgur.com/0wKCLzK.png"   // <-- LOGO OFICIAL AQUÍ
};

// =========================================================
// NORMALIZAR URL DE AVATAR (Drive, Dropbox, HTTPS)
// =========================================================
function normalizeAvatar(url) {
  if (!url) return "";

  url = String(url).trim().replace(/^["']|["']$/g, "");

  // Google Drive (file/d/ID)
  let m = url.match(/drive\.google\.com\/file\/d\/([^/]+)/);
  if (m?.[1]) return `https://drive.google.com/uc?export=view&id=${m[1]}`;

  // Google Drive (id=ID)
  m = url.match(/[?&]id=([^&]+)/);
  if (url.includes("drive.google.com") && m?.[1])
    return `https://drive.google.com/uc?export=view&id=${m[1]}`;

  // Dropbox
  if (/dropbox\.com/.test(url)) {
    url = url.replace("?dl=0","?dl=1").replace("&dl=0","&dl=1");
    if (!/[?&]dl=1$/.test(url))
      url += (url.includes("?")?"&":"?")+"dl=1";
    return url;
  }

  // sin protocolo → inválido
  if (!/^https?:\/\//i.test(url)) return "";

  return url;
}

// =========================================================
// DETECTAR USERNAME DESDE LA URL
// =========================================================
function getUsername() {
  const q = new URLSearchParams(location.search).get("u");
  if (q) return q.replace("@","").trim().toLowerCase();

  const mAt = location.pathname.match(/^\/@([^\/?#]+)/);
  if (mAt) return decodeURIComponent(mAt[1]).trim().toLowerCase();

  const mPlain = location.pathname.match(/^\/([^\/?#]+)/);
  if (mPlain && mPlain[1])
    return decodeURIComponent(mPlain[1]).trim().toLowerCase();

  return "soulink";
}

// =========================================================
// CARGAR TSV Y NORMALIZAR HEADERS
// =========================================================
async function loadTSV() {
  const res = await fetch(SHEET_TSV, { cache: "no-store" });
  const txt = await res.text();

  const lines = txt.split(/\r?\n/).filter(l => l.trim() !== "");
  const rows  = lines.map(l => l.split("\t"));
  const rawHeaders = rows[0];

  const headers = rawHeaders.map(h => (h || "").trim().toUpperCase());

  const alias = {
    THREADS: "THREATS",
    LINKEDIN: "LINKEDLN"
  };

  const map = {};
  for (let i=1; i<rows.length; i++) {
    let obj = {};
    for (let j=0; j<headers.length; j++) {
      let key = headers[j];
      let canon = alias[key] || key;  
      obj[canon] = (rows[i][j] || "").trim();
    }
    let uname = (obj.USERNAME || "").toLowerCase();
    if (uname) map[uname] = obj;
  }
  return map;
}

// =========================================================
// MOSTRAR PERFIL
// =========================================================
function renderProfile(p) {
  const avatarUrl = normalizeAvatar(p.AVATAR) || OFFICIAL.AVATAR;

  document.getElementById("avatar").src = avatarUrl;
  document.getElementById("uname").textContent = "@" + (p.USERNAME || "soulink");

  const show = (id, url) => {
    const el = document.getElementById(id);
    if (url && /^https?:\/\//i.test(url)) {
      el.href = url; el.style.display = "flex";
    }
  };

  const showMail = (id, email) => {
    const el = document.getElementById(id);
    if (email) { el.href = "mailto:" + email; el.style.display = "flex"; }
  };

  show("btn-x",  p.X);
  show("btn-fb", p.FACEBOOK);
  show("btn-ig", p.INSTAGRAM);
  show("btn-wa", p.WHATSAPP);
  show("btn-th", p.THREATS || p.THREADS);
  show("btn-tt", p.TIKTOK);
  show("btn-sc", p.SNAPCHAT);
  show("btn-yt", p.YOUTUBE);
  show("btn-tw", p.TWITCH);
  show("btn-tg", p.TELEGRAM);
  show("btn-dc", p.DISCORD);
  show("btn-gh", p.GITHUB);
  show("btn-li", p.LINKEDLN || p.LINKEDIN);
  show("btn-rd", p.REDDIT);
  show("btn-pi", p.PINTEREST);
  showMail("btn-em", p.EMAIL);
}

// =========================================================
// MAIN
// =========================================================
(async () => {
  try {
    const u = getUsername();
    const map = await loadTSV();
    const p = map[u] || OFFICIAL;

    if (!p.USERNAME) p.USERNAME = u;
    renderProfile(p);
  } catch (e) {
    console.error(e);
    renderProfile(OFFICIAL);
  }
})();
</script>
</body>
</html>
