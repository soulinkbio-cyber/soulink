<!doctype html>
<html lang="es" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="theme-color" content="#0b0f14" />
  <title>soulink.bio</title>

  <style>
    :root{
      --bg0:#05070a; --bg1:#0b0f14;
      --card:#0e141b; --card2:#0b1117;
      --text:#e9eef5; --muted:#9aa7b5;
      --stroke:rgba(255,255,255,.10); --stroke2:rgba(255,255,255,.06);
      --shadow:0 18px 60px rgba(0,0,0,.55);
      --radius:22px;
      --maxw:520px;
      --btn:54px;
      --icon:22px;
    }
    html[data-theme="light"]{
      --bg0:#f7f9fb; --bg1:#eef3f7;
      --card:#ffffff; --card2:#f7f9fb;
      --text:#0b0f14; --muted:#566474;
      --stroke:rgba(10,15,20,.14); --stroke2:rgba(10,15,20,.08);
      --shadow:0 18px 50px rgba(0,0,0,.12);
    }

    *{box-sizing:border-box}
    body{
      margin:0;
      font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial;
      color:var(--text);
      min-height:100svh;
      background:
        radial-gradient(1200px 650px at 18% 12%, rgba(120,170,255,.14), transparent 55%),
        radial-gradient(900px 520px at 82% 18%, rgba(220,240,255,.18), transparent 50%),
        linear-gradient(160deg, var(--bg0), var(--bg1));
    }

    .wrap{max-width:var(--maxw); margin:0 auto; padding:14px;}
    .card{
      border-radius:var(--radius);
      border:1px solid var(--stroke2);
      background:linear-gradient(180deg, var(--card), var(--card2));
      box-shadow:var(--shadow);
      position:relative;
    }

    .topTools{position:absolute; top:10px; right:10px;}
    .toggleBtn{
      width:34px; height:34px;
      border-radius:12px;
      border:1px solid var(--stroke2);
      background:transparent;
      color:var(--text);
      cursor:pointer;
      display:grid;
      place-items:center;
    }

    .profile{padding:18px 16px 6px; text-align:center;}
    .username{
      margin:0;
      font-size:20px;
      font-weight:900;
      letter-spacing:.2px;
      line-height:1.1;
    }
    .handle{
      margin:4px 0 0;
      font-size:12px;
      color:var(--muted);
    }

    .iconsWrap{padding:12px 16px 18px;}
    .icons{
      display:grid;
      grid-template-columns:repeat(5,1fr);
      gap:12px;
      justify-items:center;
    }
    @media(max-width:420px){
      .icons{grid-template-columns:repeat(4,1fr);}
    }

    .iconBtn{
      width:var(--btn);
      height:var(--btn);
      border-radius:999px;
      display:grid;
      place-items:center;
      background:var(--bg,#2b2f36);
      border:1px solid rgba(255,255,255,.06);
      box-shadow:0 14px 26px rgba(0,0,0,.25);
      transition:.15s;
      text-decoration:none;
    }
    .iconBtn:hover{transform:translateY(-2px);}
    .iconBtn svg{
      width:var(--icon);
      height:var(--icon);
      color:var(--fg,#fff);
    }

    .state{padding:0 16px 14px; text-align:center; font-size:13px; color:var(--muted);}
    .footer{padding:12px 16px 14px; text-align:center; font-size:12px; color:var(--muted);}
  </style>
</head>

<body>
<div class="wrap">
  <div class="card">
    <div class="topTools">
      <button class="toggleBtn" id="themeBtn">🌓</button>
    </div>

    <div class="profile">
      <h1 class="username" id="nameText">@soulink</h1>
      <p class="handle" id="handleText">soulink.bio/@soulink</p>
    </div>

    <div class="iconsWrap">
      <div class="icons" id="icons"></div>
    </div>

    <div class="state" id="state"></div>
    <div class="footer">© soulink.bio</div>
  </div>
</div>

<script>
/* ========= CONFIG ========= */
const DEFAULT_USERNAME="soulink";
const SHEETS_CSV_URL="https://docs.google.com/spreadsheets/d/e/2PACX-1vQ8qA-po2EufvnIotOaNgFsvfQqOMOFMR4KyaIGramGsEErGpOzckJYN2nPMvfsdnqoC34w_DawjNdA/pub?output=csv";

/* ========= BRAND (círculos EXACTOS) ========= */
const BRAND={
  email:{bg:"#7A7F87",fg:"#fff"},
  x:{bg:"#000",fg:"#fff"},
  facebook:{bg:"#1877F2",fg:"#fff"},
  instagram:{bg:"#C13584",fg:"#fff"},
  whatsapp:{bg:"#25D366",fg:"#fff"},
  threads:{bg:"#000",fg:"#fff"},
  tiktok:{bg:"#000",fg:"#fff"},
  snapchat:{bg:"#FFFC00",fg:"#000"},
  youtube:{bg:"#FF0000",fg:"#fff"},
  twitch:{bg:"#9146FF",fg:"#fff"},
  telegram:{bg:"#2AABEE",fg:"#fff"},
  discord:{bg:"#5865F2",fg:"#fff"},
  github:{bg:"#1F2328",fg:"#fff"},
  linkedin:{bg:"#0A66C2",fg:"#fff"},
  reddit:{bg:"#FF4500",fg:"#fff"},
  pinterest:{bg:"#BD081C",fg:"#fff"}
};

/* ========= ICONOS ========= */
const ICONS={
  email:`<svg viewBox="0 0 24 24" fill="none"><path d="M4 7h16v10H4Z" stroke="currentColor" stroke-width="2"/><path d="M4 8l8 6 8-6" stroke="currentColor" stroke-width="2"/></svg>`,
  x:`<svg viewBox="0 0 24 24"><path d="M18.2 3H21l-6.6 7.6L22 21h-6.6l-5.2-6.8L4.7 21H2l7.2-8.3L2 3h6.8l4.7 6.2L18.2 3Z" fill="currentColor"/></svg>`,
  facebook:`<svg viewBox="0 0 24 24"><path d="M14 8h3V5h-3c-2.2 0-4 1.8-4 4v3H7v3h3v6h3v-6h3l1-3h-4V9c0-.6.4-1 1-1Z" fill="currentColor"/></svg>`,
  instagram:`<svg viewBox="0 0 24 24" fill="none"><rect x="4" y="4" width="16" height="16" rx="5" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="12" r="3.5" stroke="currentColor" stroke-width="2"/><path d="M17 7h.01" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></svg>`,
  whatsapp:`<svg viewBox="0 0 24 24"><path d="M12 3.6a8.4 8.4 0 0 0-7.3 12.6L3.6 20.4l4.4-1.1A8.4 8.4 0 1 0 12 3.6Z" fill="currentColor"/></svg>`,
  threads:`<svg viewBox="0 0 24 24" fill="none"><path d="M12 3.8c4.6 0 8.2 3.3 8.2 7.9 0 4.7-2.9 8.6-8.1 8.6-3.7 0-6.1-1.9-6.9-4.9" stroke="currentColor" stroke-width="2"/></svg>`,
  tiktok:`<svg viewBox="0 0 24 24"><path d="M14 3v9.2a3.8 3.8 0 1 1-2.6-3.6V3H14Z" fill="currentColor"/></svg>`,
  snapchat:`<svg viewBox="0 0 24 24"><path d="M12 3c2.6 0 4.7 2.1 4.7 4.7v3.3c0 .7.4 1.3 1.1 1.6l.9.4c.6.3.6 1.1 0 1.4l-1.3.6c-.7.3-1.2 1-1.3 1.8-.1.9-.8 1.6-1.7 1.6H9.6c-.9 0-1.6-.7-1.7-1.6-.1-.8-.6-1.5-1.3-1.8l-1.3-.6c-.6-.3-.6-1.1 0-1.4l.9-.4c.7-.3 1.1-.9 1.1-1.6V7.7C7.3 5.1 9.4 3 12 3Z" fill="currentColor"/></svg>`,
  youtube:`<svg viewBox="0 0 24 24"><path d="M21.5 12c0 3.6-.5 5.1-1.4 6-.9.9-2.5 1.1-4.9 1.2H9.8c-2.4-.1-4-.3-4.9-1.2C4 17.1 3.5 15.6 3.5 12s.5-5.1 1.4-6C5.8 5.1 7.4 4.9 9.8 4.8h5.4c2.4.1 4 .3 4.9 1.2.9.9 1.4 2.4 1.4 6Z" fill="currentColor"/><path d="M10.5 9.5v5l5-2.5Z" fill="#fff"/></svg>`,
  twitch:`<svg viewBox="0 0 24 24"><path d="M6 4h15v10l-4 4h-4l-2 2H9v-2H6Z" fill="currentColor"/></svg>`,
  telegram:`<svg viewBox="0 0 24 24"><path d="M20.7 5.6 18 19.2c-.2 1-1 .9-1.6.6l-4.6-3.4-2.2 2.1-.5-5 9.3-8.4-11.5 7.2-5-1.6Z" fill="currentColor"/></svg>`,
  discord:`<svg viewBox="0 0 24 24"><path d="M19.5 6.3A15.2 15.2 0 0 0 16 5l-.4.8a13.3 13.3 0 0 0-3.2-.4c-1.1 0-2.2.1-3.2.4L8.8 5A15.2 15.2 0 0 0 5.3 6.3C3.6 9 3.2 11.6 3.4 14.2c1.4 1.1 2.8 1.7 4.2 2l.5-1c2.7 1.2 5.7 1.2 8.4 0l.5 1c1.4-.3 2.8-.9 4.2-2Z" fill="currentColor"/></svg>`,
  github:`<svg viewBox="0 0 24 24"><path d="M12 3.5a8.8 8.8 0 0 0-2.8 17.2c.4.1.6-.2.6-.4v-1.4c-2.4.6-2.9-1-2.9-1-.4-1.1-1-1.4-1-1.4-.8-.6.1-.6.1-.6.9.1 1.4 1 1.4 1 .8 1.4 2.2 1 2.7.8.1-.6.3-1 .6-1.3-1.9-.2-3.8-1-3.8-4.2 0-.9.3-1.7.9-2.3-.1-.2-.4-1.1.1-2.2 0 0 .7-.2 2.4.9a8.2 8.2 0 0 1 4.4 0c1.7-1.1 2.4-.9 2.4-.9.5 1.1.2 2 .1 2.2.6.6.9 1.4.9 2.3 0 3.2-1.9 4-3.8 4.2.3.2.6.8.6 1.6v2.4c0 .2.2.5.6.4A8.8 8.8 0 0 0 12 3.5Z" fill="currentColor"/></svg>`,
  linkedin:`<svg viewBox="0 0 24 24"><path d="M6.3 9.7H3.6V20.4h2.7Z" fill="currentColor"/><path d="M5 3.6a1.6 1.6 0 1 0 0 3.2Z" fill="currentColor"/><path d="M20.4 20.4h-2.7v-5.8c0-1.4-.6-2.3-1.8-2.3-1 0-1.6.7-1.8 1.3-.1.2-.1.6-.1.9v5.9H11.3V9.7H14v1.5c.5-.8 1.4-1.8 3.2-1.8 2.3 0 3.9 1.5 3.9 4.6Z" fill="currentColor"/></svg>`,
  reddit:`<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="7" fill="currentColor"/><circle cx="9.5" cy="11" r="1" fill="#fff"/><circle cx="14.5" cy="11" r="1" fill="#fff"/><path d="M9.5 14c1 1 4 1 5 0" stroke="#fff" stroke-width="2"/></svg>`,
  pinterest:`<svg viewBox="0 0 24 24"><path d="M12 3.2a8.8 8.8 0 0 0-3 17.1l1.4-5.6c-.3-.8-.4-1.3-.4-2 0-1.9 1.1-3.3 2.4-3.3 1.1 0 1.7.8 1.7 1.8 0 1.1-.7 2.7-1 4.2-.3 1.3.6 2.3 1.9 2.3 2.2 0 3.9-2.3 3.9-5.6 0-2.9-2.1-5-5.1-5Z" fill="currentColor"/></svg>`
};

/* ========= ORDER ========= */
const ORDER=[
  "email","x","facebook","instagram","whatsapp","threads","tiktok","snapchat",
  "youtube","twitch","telegram","discord","github","linkedin","reddit","pinterest"
];

/* ========= INIT ========= */
window.init = init;
init();

async function init(forceUser){
  const u = sanitize(forceUser || getParam("u") || DEFAULT_USERNAME);
  document.title = `@${u} • soulink.bio`;
  document.getElementById("nameText").textContent = "@"+u;
  document.getElementById("handleText").textContent = "soulink.bio/@"+u;
  await load(u);
}

async function load(u){
  setState("Cargando…");
  const r = await fetch(SHEETS_CSV_URL,{cache:"no-store"});
  if(!r.ok){ setState("Error leyendo Sheet"); return; }
  const t = await r.text();
  const {h,rows}=csv(t);
  const iu=h.indexOf("username");
  if(iu<0){ setState("Falta columna username"); return; }
  const row=rows.find(x=>(x[iu]||"").toLowerCase()===u.toLowerCase());
  if(!row){ setState("Usuario no encontrado"); icons([]); return; }

  const list=[];
  ORDER.forEach(k=>{
    const i=h.indexOf(k);
    if(i<0) return;
    const v=(row[i]||"").trim();
    if(!v) return;
    let url=v;
    if(k==="email"){
      url=v.includes("@")?("mailto:"+v.replace(/^mailto:/i,"")):v;
    }else if(!/^https?:\/\//i.test(v)){
      url="https://"+v;
    }
    list.push({k,url});
  });
  icons(list);
  setState("");
}

function icons(list){
  const box=document.getElementById("icons");
  box.innerHTML="";
  list.forEach(o=>{
    const a=document.createElement("a");
    a.className="iconBtn";
    a.href=o.url; a.target="_blank"; a.rel="noopener";
    const b=BRAND[o.k]||{bg:"#2b2f36",fg:"#fff"};
    a.style.setProperty("--bg",b.bg);
    a.style.setProperty("--fg",b.fg);
    a.innerHTML=ICONS[o.k]||"";
    box.appendChild(a);
  });
}

function setState(t){document.getElementById("state").textContent=t||"";}
document.getElementById("themeBtn").onclick=()=>{
  const h=document.documentElement;
  h.dataset.theme=h.dataset.theme==="dark"?"light":"dark";
};
function getParam(n){try{return new URL(location.href).searchParams.get(n)}catch(e){return null}}
function sanitize(s){return String(s||"").trim().replace(/^@/,"").replace(/[^\w.-]/g,"").slice(0,40)||DEFAULT_USERNAME}

/* ========= CSV robusto ========= */
function csv(text){
  const lines=text.replace(/\r/g,"").split("\n").filter(l=>l.trim());
  if(!lines.length) return {h:[],rows:[]};
  const h=split(lines[0]).map(norm);
  const rows=lines.slice(1).map(split);
  return {h,rows};
}
function split(line){
  const out=[]; let cur="",q=false;
  for(let i=0;i<line.length;i++){
    const c=line[i];
    if(c=='"'&&line[i+1]=='"'){cur+='"';i++;continue}
    if(c=='"'){q=!q;continue}
    if(c==","&&!q){out.push(cur);cur="";continue}
    cur+=c;
  }
  out.push(cur);
  return out.map(v=>v.trim());
}
function norm(h){
  const c=String(h||"").toLowerCase().replace(/\s+/g,"").replace(/[_-]/g,"");
  if(c==="threats"||c==="threads") return "threads";
  if(c==="linkedln"||c==="linkedin") return "linkedin";
  return c;
}
</script>
</body>
</html>
