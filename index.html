<!doctype html>
<html lang="es" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="theme-color" content="#0b0f14" />
  <title>soulink.bio</title>

  <style>
    :root{
      --bg0:#05070a; --bg1:#0b0f14;
      --card:#0e141b; --card2:#0b1117;
      --text:#e9eef5; --muted:#9aa7b5;
      --stroke:rgba(255,255,255,.10); --stroke2:rgba(255,255,255,.06);
      --shadow:0 18px 60px rgba(0,0,0,.55);
      --radius:22px;
      --maxw:520px;
      --btn:54px;
      --icon:22px;
    }
    html[data-theme="light"]{
      --bg0:#f7f9fb; --bg1:#eef3f7;
      --card:#ffffff; --card2:#f7f9fb;
      --text:#0b0f14; --muted:#566474;
      --stroke:rgba(10,15,20,.14); --stroke2:rgba(10,15,20,.08);
      --shadow:0 18px 50px rgba(0,0,0,.12);
    }

    *{box-sizing:border-box}
    body{
      margin:0;
      font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial;
      color:var(--text);
      min-height:100svh;
      background:
        radial-gradient(1200px 650px at 18% 12%, rgba(120,170,255,.14), transparent 55%),
        radial-gradient(900px 520px at 82% 18%, rgba(220,240,255,.18), transparent 50%),
        linear-gradient(160deg, var(--bg0), var(--bg1));
    }

    /* MÁS CONCENTRADO */
    .wrap{max-width:var(--maxw); margin:0 auto; padding:14px;}
    .card{
      border-radius:var(--radius);
      border:1px solid var(--stroke2);
      background:linear-gradient(180deg, var(--card), var(--card2));
      box-shadow:var(--shadow);
      position:relative;
      overflow:hidden;
    }

    .topTools{position:absolute; top:10px; right:10px;}
    .themeBtn{
      width:38px;height:38px;
      border-radius:14px;
      border:1px solid var(--stroke2);
      background:linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,.02));
      color:var(--text);
      cursor:pointer;
      display:grid;
      place-items:center;
      box-shadow:0 14px 26px rgba(0,0,0,.22);
      transition:transform .12s ease, border-color .12s ease, background .12s ease;
      user-select:none;
    }
    .themeBtn:hover{
      transform:translateY(-1px);
      border-color:rgba(255,255,255,.14);
      background:linear-gradient(180deg, rgba(255,255,255,.10), rgba(255,255,255,.03));
    }
    .themeBtn svg{width:18px;height:18px;display:block}

    .profile{padding:18px 16px 6px; text-align:center;}
    .username{
      margin:0;
      font-size:20px;
      font-weight:900;
      letter-spacing:.2px;
      line-height:1.1;
      word-break:break-word;
    }
    .handle{margin:4px 0 0; font-size:12px; color:var(--muted);}

    .iconsWrap{padding:12px 16px 18px;}
    .icons{
      display:grid;
      grid-template-columns:repeat(5,1fr);
      gap:12px;
      justify-items:center;
    }
    @media(max-width:420px){
      .icons{grid-template-columns:repeat(4,1fr);}
    }

    /* CÍRCULOS */
    .iconBtn{
      width:var(--btn);
      height:var(--btn);
      border-radius:999px;
      display:grid;
      place-items:center;
      background:var(--bg,#2b2f36);
      border:1px solid rgba(255,255,255,.06);
      box-shadow:0 14px 26px rgba(0,0,0,.25);
      transition:transform .14s ease, filter .14s ease;
      text-decoration:none;
      overflow:hidden;
    }
    .iconBtn:hover{transform:translateY(-2px); filter:brightness(1.03);}
    .iconBtn svg{
      width:var(--icon);
      height:var(--icon);
      display:block;
      color:var(--fg,#fff);
      fill:currentColor;
    }

    .state{padding:0 16px 14px; text-align:center; font-size:13px; color:var(--muted);}
    .footer{padding:12px 16px 14px; text-align:center; font-size:12px; color:var(--muted);}
  </style>
</head>

<body>

  <div class="card">
    <div class="topTools">
      <button class="themeBtn" id="themeBtn" type="button" aria-label="Cambiar tema">
        <span id="themeIcon"></span>
      </button>
    </div>

    <div class="profile">
      <h1 class="username" id="nameText">@soulink</h1>
      <p class="handle" id="handleText">soulink.bio/@soulink</p>
    </div>

    <div class="iconsWrap">
      <div class="icons" id="icons"></div>
    </div>

    <div class="state" id="state"></div>
    <div class="footer">© soulink.bio</div>
  </div>
</div>

const ORDER = [
  "email","x","facebook","instagram","whatsapp","threads","tiktok","snapchat",
  "youtube","twitch","telegram","discord","github","linkedin","reddit","pinterest"
];

/* ====== INIT (público para 404) ====== */
window.init = init;

/* Theme persist */
applySavedTheme();
renderThemeIcon();

init();

async function init(forceUser){
  const u = sanitize(forceUser || getParam("u") || DEFAULT_USERNAME);
  document.title = `@${u} • soulink.bio`;
  document.getElementById("nameText").textContent = "@"+u;
  document.getElementById("handleText").textContent = "soulink.bio/@"+u;
  await load(u);
}

/* ====== DATA ====== */
async function load(u){
  setState("Cargando…");
  const r = await fetch(SHEETS_CSV_URL, { cache:"no-store" });
  if(!r.ok){ icons([]); setState("Error leyendo Sheet publicado."); return; }
  const t = await r.text();
  const { h, rows } = parseCSV(t);

  const iu = h.indexOf("username");
  if(iu < 0){ icons([]); setState("Falta columna username."); return; }

  const row = rows.find(x => (x[iu]||"").toLowerCase() === u.toLowerCase());
  if(!row){ icons([]); setState("Usuario no encontrado."); return; }

  const list = [];
  for (const k of ORDER){
    const i = h.indexOf(k);
    if(i < 0) continue;
    const v = (row[i]||"").trim();
    if(!v) continue;

    let url = v;
    if(k === "email"){
      url = v.includes("@") ? ("mailto:" + v.replace(/^mailto:/i,"")) : v;
    }else{
      if(!/^https?:\/\//i.test(url)) url = "https://" + url;
    }
    list.push({ k, url });
  }

  icons(list);
  setState(list.length ? "" : "No hay redes guardadas todavía.");
}

/* ====== RENDER ====== */
function icons(list){
  const box = document.getElementById("icons");
  box.innerHTML = "";
  list.forEach(o=>{
    const a = document.createElement("a");
    a.className = "iconBtn";
    a.href = o.url;
    a.target = "_blank";
    a.rel = "noopener noreferrer";
    a.title = o.k.toUpperCase();

    const b = BRAND[o.k] || { bg:"#2b2f36", fg:"#fff" };
    a.style.setProperty("--bg", b.bg);
    a.style.setProperty("--fg", b.fg);
    a.innerHTML = ICONS[o.k] || "";
    box.appendChild(a);
  });
}

function setState(msg){ document.getElementById("state").textContent = msg || ""; }
function getParam(name){ try{ return new URL(location.href).searchParams.get(name); } catch(e){ return null; } }
function sanitize(s){
  return String(s||"").trim().replace(/^@/,"").replace(/[^\w.-]/g,"").slice(0,40) || DEFAULT_USERNAME;
}

/* ====== THEME BTN PRO ====== */
document.getElementById("themeBtn").onclick = ()=>{
  const html = document.documentElement;
  html.dataset.theme = (html.dataset.theme === "dark") ? "light" : "dark";
  localStorage.setItem("soulink_theme", html.dataset.theme);
  renderThemeIcon();
};

function applySavedTheme(){
  const saved = localStorage.getItem("soulink_theme");
  if(saved === "light" || saved === "dark"){
    document.documentElement.dataset.theme = saved;
  }
}

function renderThemeIcon(){
  const isDark = document.documentElement.dataset.theme !== "light";
  document.getElementById("themeIcon").innerHTML = isDark ? svgMoon() : svgSun();
}

function svgSun(){
  return `<svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
    <path d="M12 17a5 5 0 1 0 0-10a5 5 0 0 0 0 10Z" fill="currentColor" opacity=".92"/>
    <path d="M12 2.6v2.2M12 19.2v2.2M4.6 12H2.4M21.6 12h-2.2M5.5 5.5l1.6 1.6M16.9 16.9l1.6 1.6M18.5 5.5l-1.6 1.6M7.1 16.9l-1.6 1.6"
      stroke="currentColor" stroke-width="2" stroke-linecap="round" opacity=".9"/>
  </svg>`;
}
function svgMoon(){
  return `<svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
    <path d="M21 15.2A8.2 8.2 0 0 1 8.8 3a6.8 6.8 0 1 0 12.2 12.2Z" fill="currentColor" opacity=".92"/>
  </svg>`;
}

/* ====== CSV ROBUSTO ====== */
function parseCSV(text){
  const lines = text.replace(/\r/g,"").split("\n").filter(l => l.trim());
  if(!lines.length) return { h:[], rows:[] };

  const h = splitCSVLine(lines[0]).map(normalizeHeader);
  const rows = lines.slice(1).map(splitCSVLine).map(r => r.map(v => (v||"").trim()));
  return { h, rows };
}
function splitCSVLine(line){
  const out=[]; let cur=""; let q=false;
  for(let i=0;i<line.length;i++){
    const ch=line[i];
    if(ch === '"' && line[i+1] === '"'){ cur+='"'; i++; continue; }
    if(ch === '"'){ q=!q; continue; }
    if(ch === "," && !q){ out.push(cur); cur=""; continue; }
    cur += ch;
  }
  out.push(cur);
  return out;
}
function normalizeHeader(h){
  const clean = String(h||"").trim().toLowerCase()
    .replace(/\s+/g,"")
    .replace(/[_-]/g,"");
  if(clean === "threats" || clean === "threads") return "threads";
  if(clean === "linkedln" || clean === "linkedin") return "linkedin";
  return clean;
}
