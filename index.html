<!doctype html>
<html lang="es" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>soulink.bio</title>

<style>
:root{
  --bg:#0b0f14;
  --card:#111827;
  --text:#e5e7eb;
  --muted:#9ca3af;
  --radius:26px;
}

html[data-theme="light"]{
  --bg:#f3f4f6;
  --card:#ffffff;
  --text:#111827;
  --muted:#6b7280;
}

body{
  margin:0;
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  background:radial-gradient(circle at top, #1f2937, var(--bg));
  font-family:system-ui,-apple-system,BlinkMacSystemFont;
  color:var(--text);
}

.card{
  width:100%;
  max-width:420px;
  background:var(--card);
  border-radius:var(--radius);
  padding:28px 22px 30px;
  box-shadow:0 30px 80px rgba(0,0,0,.45);
  text-align:center;
  position:relative;
}

.theme-btn{
  position:absolute;
  top:16px;
  right:16px;
  background:none;
  border:none;
  color:var(--text);
  font-size:18px;
  cursor:pointer;
}

.username{
  font-size:26px;
  font-weight:800;
  margin:10px 0 4px;
}

.handle{
  font-size:13px;
  color:var(--muted);
  margin-bottom:22px;
}

.icons{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:16px;
}

.icon{
  width:64px;
  height:64px;
  border-radius:18px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:rgba(255,255,255,.04);
}

.icon img{
  width:44px;
  height:44px;
}

.footer{
  margin-top:22px;
  font-size:12px;
  color:var(--muted);
}
</style>
</head>

<body>
<div class="card">

<button class="theme-btn" onclick="toggleTheme()">🌙</button>

<div class="username" id="username">@soulink</div>
<div class="handle" id="handle">soulink.bio/@soulink</div>

<div class="icons" id="icons"></div>

<div class="footer">© soulink.bio</div>
</div>

<script>
const SHEETS =
"https://docs.google.com/spreadsheets/d/e/2PACX-1vQ8qA-po2EufvnIotOaNgFsvfQqOMOFMR4KyaIGramGsEErGpOzckJYN2nPMvfsdnqoC34w_DawjNdA/pub?output=csv";

const ICONS = {
  email:"email",
  x:"x",
  facebook:"facebook",
  instagram:"instagram",
  whatsapp:"whatsapp",
  threads:"threads",
  tiktok:"tiktok",
  snapchat:"snapchat",
  youtube:"youtube",
  twitch:"twitch",
  telegram:"telegram",
  discord:"discord",
  github:"github",
  reddit:"reddit",
  pinterest:"pinterest",
};

window.loadProfile = async function(user){
  const username = user || new URLSearchParams(location.search).get("u") || "soulink";
  document.getElementById("username").textContent = "@"+username;
  document.getElementById("handle").textContent = "soulink.bio/@"+username;

  const res = await fetch(SHEETS);
  const text = await res.text();
  const rows = text.split("\n").map(r=>r.split(","));
  const headers = rows.shift().map(h=>h.trim().toLowerCase());

  const data = rows.map(r=>{
    let o={}; headers.forEach((h,i)=>o[h]=r[i]); return o;
  });

  const row = data.find(r=>(r.username||"").toLowerCase()===username.toLowerCase());
  if(!row) return;

  const box = document.getElementById("icons");
  box.innerHTML="";

  for(const key in ICONS){
    if(row[key]){
      const a=document.createElement("a");
      a.href=row[key].startsWith("http")?row[key]:"https://"+row[key];
      a.target="_blank";
      a.className="icon";

      const img=document.createElement("img");
      img.src="/icons/"+ICONS[key]+".svg";
      img.alt=key;

      a.appendChild(img);
      box.appendChild(a);
    }
  }
};

function toggleTheme(){
  const html=document.documentElement;
  html.dataset.theme = html.dataset.theme==="dark"?"light":"dark";
}
</script>
</body>
</html>
