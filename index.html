<!doctype html>
<html lang="es" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="theme-color" content="#0b0f14" />
  <title>soulink.bio</title>

  <style>
    :root{
      --radius:26px;
      --maxw:560px;

      --bg0:#05070a; --bg1:#0b0f14;
      --card:#0e141b; --card2:#0b1117;
      --text:#e9eef5; --muted:#9aa7b5;
      --stroke:rgba(255,255,255,.10); --stroke2:rgba(255,255,255,.07);
      --shadow:0 18px 60px rgba(0,0,0,.55);

      --btn:64px;
      --icon:46px;
    }
    html[data-theme="light"]{
      --bg0:#f7f9fb; --bg1:#eef3f7;
      --card:#ffffff; --card2:#f7f9fb;
      --text:#0b0f14; --muted:#566474;
      --stroke:rgba(10,15,20,.14); --stroke2:rgba(10,15,20,.09);
      --shadow:0 18px 50px rgba(0,0,0,.12);
    }

    *{box-sizing:border-box}
    body{
      margin:0;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;
      color:var(--text);
      min-height:100svh;
      background:
        radial-gradient(1200px 650px at 18% 12%, rgba(120,170,255,.14), transparent 55%),
        radial-gradient(900px 520px at 82% 18%, rgba(220,240,255,.18), transparent 50%),
        radial-gradient(900px 520px at 50% 90%, rgba(255,255,255,.10), transparent 52%),
        linear-gradient(160deg, var(--bg0), var(--bg1));
      display:flex;
      align-items:center;
      justify-content:center;
      padding:26px 16px;
    }

    .wrap{width:100%; max-width:var(--maxw);}
    .card{
      border-radius:var(--radius);
      border:1px solid var(--stroke2);
      background:
        radial-gradient(700px 240px at 40% 0%, rgba(255,255,255,.10), transparent 50%),
        linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,.02)),
        linear-gradient(180deg, var(--card), var(--card2));
      box-shadow:var(--shadow);
      overflow:hidden;
      backdrop-filter:blur(12px);
      position:relative;
      padding:22px 18px 22px;
    }

    .topTools{position:absolute; top:14px; right:14px; z-index:5;}
    .toggleBtn{
      width:44px; height:44px;
      border-radius:16px;
      border:1px solid var(--stroke2);
      background:linear-gradient(180deg, rgba(255,255,255,.08), rgba(255,255,255,.02));
      color:var(--text);
      box-shadow:0 10px 18px rgba(0,0,0,.18);
      cursor:pointer;
      display:grid;
      place-items:center;
      transition:transform .12s ease, border-color .12s ease;
    }
    .toggleBtn:hover{ transform:translateY(-1px); border-color:rgba(255,255,255,.18); }

    .profile{
      text-align:center;
      padding:4px 10px 10px;
    }
    .username{
      margin:18px 0 0;
      font-size:28px;
      line-height:1.05;
      font-weight:950;
      letter-spacing:.2px;
      word-break:break-word;
    }
    .handle{
      margin:8px 0 0;
      font-size:13px;
      color:var(--muted);
    }

    .icons{
      margin-top:18px;
      display:grid;
      grid-template-columns:repeat(5, 1fr);
      gap:14px;
      justify-items:center;
      padding:8px 10px 6px;
    }
    @media(max-width:420px){
      .icons{ grid-template-columns:repeat(4, 1fr); }
    }

    .iconBtn{
      width:var(--btn);
      height:var(--btn);
      border-radius:22px;
      border:1px solid var(--stroke2);
      background:linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,.02));
      box-shadow:0 12px 24px rgba(0,0,0,.18);
      display:grid;
      place-items:center;
      text-decoration:none;
      transition:transform .12s ease, border-color .12s ease, background .12s ease;
      position:relative;
    }
    .iconBtn:hover{
      transform:translateY(-1px);
      border-color:rgba(255,255,255,.18);
      background:linear-gradient(180deg, rgba(255,255,255,.10), rgba(255,255,255,.03));
    }

    .iconImg{
      width:var(--icon);
      height:var(--icon);
      border-radius:999px;
      object-fit:cover;
      display:block;
    }

    /* Debug label si falla (solo aparece en fallback) */
    .debugTag{
      position:absolute;
      bottom:6px;
      left:6px;
      right:6px;
      font-size:9px;
      color:rgba(233,238,245,.75);
      text-align:center;
      pointer-events:none;
      display:none;
    }
    .iconBtn.fallback .debugTag{ display:block; }

    .state{margin-top:10px; text-align:center; font-size:13px; color:var(--muted);}
    .footer{margin-top:18px; text-align:center; font-size:12px; color:rgba(154,167,181,.85);}
  </style>
</head>

<body>
  <div class="wrap">
    <div class="card">
      <div class="topTools">
        <button class="toggleBtn" id="themeBtn" type="button" aria-label="Cambiar tema">☾</button>
      </div>

      <div class="profile">
        <h1 class="username" id="nameText">@soulink</h1>
        <div class="handle" id="handleText">soulink.bio/@soulink</div>
      </div>

      <div class="icons" id="icons"></div>
      <div class="state" id="state"></div>
      <div class="footer">© soulink.bio</div>
    </div>
  </div>

<script>
  const DEFAULT_USERNAME = "soulink";

  const SHEETS_CSV_URL =
    "https://docs.google.com/spreadsheets/d/e/2PACX-1vQ8qA-po2EufvnIotOaNgFsvfQqOMOFMR4KyaIGramGsEErGpOzckJYN2nPMvfsdnqoC34w_DawjNdA/pub?output=csv";

  // ✅ Base ABSOLUTA: NO depende del path /@user
  const ICON_BASE = "https://soulink.bio/icons/";

  // Orden exacto como tu imagen:
  const ORDER = [
    "x","facebook","instagram","whatsapp","threads",
    "tiktok","snapchat","youtube","twitch","telegram",
    "discord","github","reddit","pinterest","email"
  ];

  // Theme
  const THEME_KEY = "soulink_theme";
  const getTheme = () => localStorage.getItem(THEME_KEY) || document.documentElement.getAttribute("data-theme") || "dark";
  const setTheme = (t) => {
    document.documentElement.setAttribute("data-theme", t);
    localStorage.setItem(THEME_KEY, t);
    document.getElementById("themeBtn").textContent = (t === "dark") ? "☾" : "☀";
  };
  document.getElementById("themeBtn").addEventListener("click", () => {
    setTheme(getTheme() === "dark" ? "light" : "dark");
  });

  (async function init(){
    setTheme(getTheme());
    const u = sanitizeUsername(getParam("u") || DEFAULT_USERNAME);
    await loadProfile(u);
  })();

  window.loadProfile = loadProfile;

  async function loadProfile(username){
    const safeU = sanitizeUsername(username);
    document.title = `@${safeU} • soulink.bio`;
    document.getElementById("nameText").textContent = `@${safeU}`;
    document.getElementById("handleText").textContent = `soulink.bio/@${safeU}`;

    setState("Cargando…");
    renderIcons([]);

    try{
      const row = await fetchUserRowFromCSV(SHEETS_CSV_URL, safeU);
      if(!row){
        setState("Este usuario todavía no existe en la base de datos.");
        return;
      }

      const links = extractLinksFromRow(row);
      const sorted = sortLinks(links);
      renderIcons(sorted);
      setState(sorted.length ? "" : "No hay redes sociales guardadas todavía.");
    }catch(e){
      console.error(e);
      setState("No pude cargar la data. Verifica que el Sheet esté publicado.");
    }
  }

  function renderIcons(links){
    const box = document.getElementById("icons");
    box.innerHTML = "";

    links.forEach(l=>{
      const a = document.createElement("a");
      a.className = "iconBtn";
      a.href = l.url;
      a.target = "_blank";
      a.rel = "noopener noreferrer";
      a.title = l.type.toUpperCase();

      const img = document.createElement("img");
      img.className = "iconImg";
      img.alt = l.type;

      // ✅ intenta PNG primero (lo que tú ya hiciste)
      // cache-bust para Safari
      img.src = `${ICON_BASE}${l.type}.png?v=99`;

      // fallback inline (si NO existe el PNG)
      img.onerror = () => {
        a.classList.add("fallback");
        img.src = inlineFallbackIcon(l.type);
      };

      const tag = document.createElement("div");
      tag.className = "debugTag";
      tag.textContent = `${l.type}.png`;

      a.appendChild(img);
      a.appendChild(tag);
      box.appendChild(a);
    });
  }

  function inlineFallbackIcon(type){
    const letter = (type || "?").slice(0,1).toUpperCase();
    const svg =
      `<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96">
        <defs>
          <radialGradient id="g" cx="30%" cy="25%" r="80%">
            <stop offset="0" stop-color="rgba(255,255,255,.20)"/>
            <stop offset="1" stop-color="rgba(255,255,255,.05)"/>
          </radialGradient>
        </defs>
        <circle cx="48" cy="48" r="46" fill="#1b2430"/>
        <circle cx="48" cy="48" r="46" fill="url(#g)"/>
        <text x="48" y="60" text-anchor="middle" font-size="38" font-family="system-ui" fill="rgba(233,238,245,.9)" font-weight="800">${letter}</text>
      </svg>`;
    return "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svg);
  }

  async function fetchUserRowFromCSV(csvUrl, username){
    const res = await fetch(csvUrl, { cache:"no-store" });
    if(!res.ok) throw new Error("CSV fetch failed: " + res.status);
    const text = await res.text();
    const { headers, rows } = parseCSV(text);

    const objs = rows.map(r=>{
      const o={}; headers.forEach((h,i)=> o[h]=(r[i]??"").trim()); return o;
    });

    const key = username.toLowerCase();
    return objs.find(o => (o.username || o.user || o.handle || o.usuario || "").toLowerCase().trim() === key) || null;
  }

  function extractLinksFromRow(row){
    const links = [];
    for(const k in row){
      const type = normalizeType(k);
      const val = String(row[k]||"").trim();
      if(!val) continue;

      if(type === "email"){
        const mail = val.replace(/^mailto:/i,"").trim();
        if(mail.includes("@")) links.push({ type:"email", url:"mailto:" + mail });
        continue;
      }

      if(ORDER.includes(type)){
        links.push({ type, url: normalizeUrl(val) });
      }
    }
    return links;
  }

  function sortLinks(links){
    const rank = (t)=> {
      const i = ORDER.indexOf(t);
      return i === -1 ? 999 : i;
    };
    return links.slice().sort((a,b)=> rank(a.type) - rank(b.type));
  }

  function normalizeType(header){
    const h = String(header||"").trim().toLowerCase();
    const clean = h.replace(/\s+/g,"").replace(/[_-]/g,"");

    if(clean === "email") return "email";
    if(clean === "x" || clean === "twitter") return "x";
    if(clean === "facebook" || clean === "fb") return "facebook";
    if(clean === "instagram" || clean === "ig") return "instagram";
    if(clean === "whatsapp" || clean === "wa") return "whatsapp";
    if(clean === "threads" || clean === "threats") return "threads";
    if(clean === "tiktok") return "tiktok";
    if(clean === "snapchat" || clean === "snap") return "snapchat";
    if(clean === "youtube" || clean === "yt") return "youtube";
    if(clean === "twitch") return "twitch";
    if(clean === "telegram" || clean === "tg") return "telegram";
    if(clean === "discord") return "discord";
    if(clean === "github") return "github";
    if(clean === "linkedln" || clean === "linkedin") return "linkedin";
    if(clean === "reddit") return "reddit";
    if(clean === "pinterest") return "pinterest";
    return "generic";
  }

  function parseCSV(text){
    const lines=text.replace(/\r/g,"").split("\n").filter(Boolean);
    const rows=[]; let headers=[];
    for(let i=0;i<lines.length;i++){
      const row=splitCSVLine(lines[i]);
      if(i===0) headers=row.map(h=>String(h||"").trim().toLowerCase());
      else rows.push(row);
    }
    return { headers, rows };
  }
  function splitCSVLine(line){
    const out=[]; let cur=""; let q=false;
    for(let i=0;i<line.length;i++){
      const ch=line[i];
      if(ch === '"' && line[i+1] === '"'){ cur+='"'; i++; continue; }
      if(ch === '"'){ q=!q; continue; }
      if(ch === "," && !q){ out.push(cur); cur=""; continue; }
      cur += ch;
    }
    out.push(cur);
    return out;
  }

  function normalizeUrl(u){
    const s=String(u||"").trim();
    if(!s) return "";
    if(/^https?:\/\//i.test(s)) return s;
    if(/^mailto:/i.test(s)) return s;
    return "https://" + s;
  }

  function sanitizeUsername(u){
    return String(u||"").trim().replace(/^@/,"").replace(/[^\w.-]/g,"").slice(0,40) || "usuario";
  }

  function setState(msg){ document.getElementById("state").textContent = msg || ""; }

  function getParam(name){
    try{ return new URL(location.href).searchParams.get(name); }
    catch(e){ return null; }
  }
</script>
</body>
</html>
