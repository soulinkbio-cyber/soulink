<!doctype html>
<html lang="es" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="theme-color" content="#0b0f14" />
  <title>soulink.bio</title>

  <style>
    :root{
      --bg0:#05070a; --bg1:#0b0f14;
      --card:#0e141b; --card2:#0b1117;
      --text:#e9eef5; --muted:#9aa7b5;
      --stroke:rgba(255,255,255,.10); --stroke2:rgba(255,255,255,.06);
      --shadow:0 18px 60px rgba(0,0,0,.55);
      --radius:22px;
      --maxw:540px;
    }
    html[data-theme="light"]{
      --bg0:#f7f9fb; --bg1:#eef3f7;
      --card:#ffffff; --card2:#f7f9fb;
      --text:#0b0f14; --muted:#566474;
      --stroke:rgba(10,15,20,.14); --stroke2:rgba(10,15,20,.08);
      --shadow:0 18px 50px rgba(0,0,0,.12);
    }

    *{box-sizing:border-box}
    body{
      margin:0;
      font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial;
      color:var(--text);
      min-height:100svh;
      background:
        radial-gradient(1200px 650px at 18% 12%, rgba(120,170,255,.14), transparent 55%),
        radial-gradient(900px 520px at 82% 18%, rgba(220,240,255,.18), transparent 50%),
        linear-gradient(160deg, var(--bg0), var(--bg1));
    }

    .wrap{max-width:var(--maxw); margin:0 auto; padding:26px 16px;}
    .card{
      border-radius:var(--radius);
      border:1px solid var(--stroke2);
      background:linear-gradient(180deg, var(--card), var(--card2));
      box-shadow:var(--shadow);
      position:relative;
    }

    .topTools{
      position:absolute; top:12px; right:12px;
    }
    .toggleBtn{
      width:36px; height:36px;
      border-radius:12px;
      border:1px solid var(--stroke2);
      background:transparent;
      color:var(--text);
      cursor:pointer;
      font-size:16px;
    }

    .profile{
      padding:26px 18px 6px;
      text-align:center;
    }
    .username{
      margin:0;
      font-size:21px;        /* 👈 reducido */
      font-weight:800;
      letter-spacing:.2px;
    }
    .handle{
      margin:4px 0 0;
      font-size:12px;
      color:var(--muted);
    }

    .iconsWrap{padding:16px 16px 22px;}
    .icons{
      display:grid;
      grid-template-columns:repeat(5,1fr);
      gap:12px;
    }
    @media(max-width:420px){
      .icons{grid-template-columns:repeat(4,1fr);}
    }

    .iconBtn{
      height:54px;
      border-radius:18px;
      border:1px solid var(--stroke2);
      display:grid;
      place-items:center;
      background:transparent;
      transition:.15s;
    }
    .iconBtn:hover{
      transform:translateY(-2px);
      border-color:rgba(255,255,255,.18);
    }
    .iconBtn svg{
      width:24px; height:24px;
      color:var(--brandColor,#e9eef5);
    }

    .state{
      padding:0 16px 16px;
      text-align:center;
      font-size:13px;
      color:var(--muted);
    }
    .footer{
      padding:14px 16px 18px;
      text-align:center;
      font-size:12px;
      color:var(--muted);
    }
  </style>
</head>

<body>
<div class="wrap">
  <div class="card">
    <div class="topTools">
      <button class="toggleBtn" id="themeBtn">🌓</button>
    </div>

    <div class="profile">
      <h1 class="username" id="nameText">@soulink</h1>
      <p class="handle" id="handleText">soulink.bio/@soulink</p>
    </div>

    <div class="iconsWrap">
      <div class="icons" id="icons"></div>
    </div>

    <div class="state" id="state"></div>
    <div class="footer">© soulink.bio</div>
  </div>
</div>

<script>
const DEFAULT_USERNAME="soulink";
const SHEETS_CSV_URL="https://docs.google.com/spreadsheets/d/e/2PACX-1vQ8qA-po2EufvnIotOaNgFsvfQqOMOFMR4KyaIGramGsEErGpOzckJYN2nPMvfsdnqoC34w_DawjNdA/pub?output=csv";

const BRAND={
  email:"#e9eef5",x:"#e9eef5",facebook:"#1877F2",instagram:"#E1306C",
  whatsapp:"#25D366",threads:"#e9eef5",tiktok:"#00F2EA",
  snapchat:"#FFFC00",youtube:"#FF0033",twitch:"#9146FF",
  telegram:"#26A5E4",discord:"#5865F2",github:"#e9eef5",
  linkedin:"#0A66C2",reddit:"#FF4500",pinterest:"#E60023"
};

const ICONS={
  email:`<svg viewBox="0 0 24 24"><path d="M4 7h16v10H4z" fill="none" stroke="currentColor" stroke-width="2"/><path d="M4 8l8 6 8-6" fill="none" stroke="currentColor" stroke-width="2"/></svg>`,
  x:`<svg viewBox="0 0 24 24"><path d="M18 3h3l-7 8 8 10h-6l-5-6-5 6H2l8-9-8-9h6l4 5z" fill="currentColor"/></svg>`,
  instagram:`<svg viewBox="0 0 24 24"><rect x="2" y="2" width="20" height="20" rx="6" ry="6" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="2"/></svg>`,
  whatsapp:`<svg viewBox="0 0 24 24"><path d="M12 3a9 9 0 0 0-7.5 14.2L3 21l4-1.3A9 9 0 1 0 12 3z" fill="currentColor"/></svg>`,
  telegram:`<svg viewBox="0 0 24 24"><path d="M21 4L3 11l6 2 2 6 3-4 4 3z" fill="currentColor"/></svg>`,
  discord:`<svg viewBox="0 0 24 24"><path d="M19 6c-2-1-4-1-4-1l-.3.6a12 12 0 0 0-5.4 0L9 5s-2 0-4 1C3 9 3 15 3 15s2 3 6 3l.7-1c-1-.3-2-.8-3-1.5l.6-.4c2 1 6 1 8 0l.6.4c-1 .7-2 1.2-3 1.5l.7 1c4 0 6-3 6-3s0-6-2-9z" fill="currentColor"/></svg>`,
  tiktok:`<svg viewBox="0 0 24 24"><path d="M14 3v10a4 4 0 1 1-3-3.9V3z" fill="currentColor"/></svg>`,
  reddit:`<svg viewBox="0 0 24 24"><circle cx="12" cy="13" r="6" fill="currentColor"/><circle cx="9.5" cy="12" r="1" fill="#05070a"/><circle cx="14.5" cy="12" r="1" fill="#05070a"/></svg>`
};

const ORDER=["email","x","instagram","whatsapp","tiktok","telegram","discord","reddit"];

init();
async function init(){
  const u=new URL(location.href).searchParams.get("u")||DEFAULT_USERNAME;
  document.getElementById("nameText").textContent="@"+u;
  document.getElementById("handleText").textContent="soulink.bio/@"+u;
  await loadLinks(u);
}

async function loadLinks(u){
  const res=await fetch(SHEETS_CSV_URL);
  const txt=await res.text();
  const lines=txt.split("\n");
  const headers=lines[0].toLowerCase().split(",");
  const rows=lines.slice(1);
  let row=null;
  rows.forEach(r=>{
    const cols=r.split(",");
    if(cols[headers.indexOf("username")]===u) row=cols;
  });
  if(!row){setState("Usuario no encontrado");return;}
  const icons=document.getElementById("icons");
  icons.innerHTML="";
  ORDER.forEach(k=>{
    const i=headers.indexOf(k);
    if(i>-1 && row[i]){
      const a=document.createElement("a");
      a.href=row[i].startsWith("http")?row[i]:"https://"+row[i];
      a.target="_blank";
      a.className="iconBtn";
      a.style.setProperty("--brandColor",BRAND[k]);
      a.innerHTML=ICONS[k];
      icons.appendChild(a);
    }
  });
}

function setState(t){document.getElementById("state").textContent=t||"";}
document.getElementById("themeBtn").onclick=()=>{
  const h=document.documentElement;
  h.dataset.theme=h.dataset.theme==="dark"?"light":"dark";
};
</script>
</body>
</html>
