<!doctype html>
<html lang="es" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="theme-color" content="#0b0f14" />
  <title>soulink.bio</title>

  <style>
    :root{
      --radius:22px;
      --maxw:540px;

      /* Dark */
      --bg0:#05070a; --bg1:#0b0f14;
      --card:#0e141b; --card2:#0b1117;
      --text:#e9eef5; --muted:#9aa7b5;
      --stroke:rgba(255,255,255,.10); --stroke2:rgba(255,255,255,.06);
      --shadow:0 18px 60px rgba(0,0,0,.55);
      --grainA:rgba(255,255,255,.06);
      --grainB:rgba(255,255,255,.016);

      --iconBox:56px;
      --iconCircle:38px;
    }
    html[data-theme="light"]{
      /* Light */
      --bg0:#f7f9fb; --bg1:#eef3f7;
      --card:#ffffff; --card2:#f7f9fb;
      --text:#0b0f14; --muted:#566474;
      --stroke:rgba(10,15,20,.14); --stroke2:rgba(10,15,20,.08);
      --shadow:0 18px 50px rgba(0,0,0,.12);
      --grainA:rgba(0,0,0,.05);
      --grainB:rgba(0,0,0,.018);
    }

    *{box-sizing:border-box}
    body{
      margin:0;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;
      color:var(--text);
      min-height:100svh;
      background:
        radial-gradient(1200px 650px at 18% 12%, rgba(120,170,255,.14), transparent 55%),
        radial-gradient(900px 520px at 82% 18%, rgba(220,240,255,.18), transparent 50%),
        radial-gradient(900px 520px at 50% 90%, rgba(255,255,255,.10), transparent 52%),
        linear-gradient(160deg, var(--bg0), var(--bg1) 55%, var(--bg0));
      overflow-x:hidden;

      /* ✅ más centrado */
      display:flex;
      align-items:center;
      justify-content:center;
      padding:26px 16px;
    }
    body::before{
      content:"";
      position:fixed; inset:0; pointer-events:none;
      background:
        linear-gradient(115deg, var(--grainA), transparent 35%, rgba(255,255,255,.04) 60%, transparent),
        repeating-linear-gradient(90deg, var(--grainB) 0 1px, transparent 1px 4px);
      mix-blend-mode:overlay;
      opacity:.55;
    }

    .wrap{width:100%; max-width:var(--maxw);}

    .card{
      border-radius:var(--radius);
      border:1px solid var(--stroke2);
      background:
        radial-gradient(700px 240px at 40% 0%, rgba(255,255,255,.10), transparent 50%),
        linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,.02)),
        linear-gradient(180deg, var(--card), var(--card2));
      box-shadow:var(--shadow);
      overflow:hidden;
      backdrop-filter:blur(12px);
      position:relative;
    }

    .topTools{
      position:absolute;
      top:12px; right:12px;
      display:flex; gap:10px; align-items:center;
      z-index:5;
    }

    /* ✅ toggle pro: solo ícono */
    .toggleBtn{
      width:42px; height:42px;
      border-radius:16px;
      border:1px solid var(--stroke2);
      background:linear-gradient(180deg, rgba(255,255,255,.08), rgba(255,255,255,.02));
      color:var(--text);
      box-shadow:0 10px 18px rgba(0,0,0,.18);
      cursor:pointer;
      display:grid;
      place-items:center;
      transition:transform .12s ease, border-color .12s ease;
    }
    .toggleBtn:hover{ transform:translateY(-1px); border-color:rgba(255,255,255,.16); }
    .toggleBtn svg{width:18px;height:18px;display:block}

    .profile{
      padding:22px 18px 10px;
      display:flex;
      flex-direction:column;
      align-items:center;
      gap:8px;
      text-align:center;
    }

    /* ✅ más proporcional */
    .username{
      margin:0;
      font-size:22px;
      line-height:1.05;
      font-weight:950;
      letter-spacing:.2px;
      word-break:break-word;
    }
    .handle{
      margin:0;
      font-size:12.5px;
      color:var(--muted);
    }

    .iconsWrap{padding:10px 16px 18px;}
    .icons{
      display:grid;
      grid-template-columns: repeat(5, 1fr);
      gap:12px;
      justify-items:center;
    }
    @media (max-width: 420px){
      .icons{grid-template-columns: repeat(4, 1fr);}
    }

    .iconBtn{
      width:var(--iconBox);
      height:var(--iconBox);
      border-radius:18px;
      border:1px solid var(--stroke2);
      background:linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,.02));
      box-shadow:0 12px 22px rgba(0,0,0,.18);
      display:grid;
      place-items:center;
      text-decoration:none;
      position:relative;
      overflow:hidden;
      transition: transform .12s ease, border-color .12s ease, background .12s ease;
    }
    .iconBtn:hover{
      transform: translateY(-1px);
      border-color: rgba(255,255,255,.16);
      background:linear-gradient(180deg, rgba(255,255,255,.10), rgba(255,255,255,.03));
    }
    .iconCircle{
      width:var(--iconCircle);
      height:var(--iconCircle);
      border-radius:999px;
      display:grid;
      place-items:center;
      background: radial-gradient(circle at 40% 20%, rgba(255,255,255,.18), rgba(255,255,255,.06));
      border:1px solid rgba(255,255,255,.10);
      position:relative;
    }
    html[data-theme="light"] .iconCircle{
      background: radial-gradient(circle at 40% 20%, rgba(10,15,20,.10), rgba(10,15,20,.04));
      border:1px solid rgba(10,15,20,.12);
    }

    .iconCircle::before{
      content:"";
      position:absolute;
      inset:-30%;
      background: radial-gradient(circle at 50% 50%, var(--brandGlow, rgba(255,255,255,.10)), transparent 55%);
      opacity:.85;
      pointer-events:none;
    }

    .iconCircle svg{
      width:18px;
      height:18px;
      display:block;
      color: var(--brandColor, var(--text));
      filter: drop-shadow(0 6px 12px rgba(0,0,0,.22));
      position:relative;
      z-index:1;
    }

    .state{padding:0 16px 14px; color:var(--muted); font-size:13px; text-align:center;}
    .footer{padding:14px 16px 16px; color:rgba(154,167,181,.85); font-size:12px; text-align:center;}
  </style>
</head>

<body>
  <div class="wrap">
    <div class="card">
      <div class="topTools">
        <button class="toggleBtn" id="themeBtn" type="button" aria-label="Cambiar tema"></button>
      </div>

      <div class="profile">
        <h1 class="username" id="nameText">@soulink</h1>
        <p class="handle" id="handleText">soulink.bio/@soulink</p>
      </div>

      <div class="iconsWrap">
        <div class="icons" id="icons"></div>
      </div>

      <div class="state" id="state"></div>
      <div class="footer">© soulink.bio</div>
    </div>
  </div>

  <script>
    /***********************
     * CONFIG
     ***********************/
    const DEFAULT_USERNAME = "soulink";

    // ✅ Tu Google Sheet publicado (CSV)
    const SHEETS_CSV_URL =
      "https://docs.google.com/spreadsheets/d/e/2PACX-1vQ8qA-po2EufvnIotOaNgFsvfQqOMOFMR4KyaIGramGsEErGpOzckJYN2nPMvfsdnqoC34w_DawjNdA/pub?output=csv";

    /***********************
     * THEME TOGGLE (solo iconos)
     ***********************/
    const THEME_KEY = "soulink_theme";

    function setTheme(theme){
      document.documentElement.setAttribute("data-theme", theme);
      localStorage.setItem(THEME_KEY, theme);
      renderThemeIcon(theme);
    }
    function getTheme(){
      return localStorage.getItem(THEME_KEY) || document.documentElement.getAttribute("data-theme") || "dark";
    }
    function renderThemeIcon(theme){
      const btn = document.getElementById("themeBtn");
      btn.innerHTML = (theme === "dark") ? svgMoon() : svgSun();
    }
    document.getElementById("themeBtn").addEventListener("click", ()=>{
      const cur = getTheme();
      setTheme(cur === "dark" ? "light" : "dark");
    });

    /***********************
     * BRAND COLORS
     ***********************/
    const BRAND = {
      email:      { color:"#E9EEF5", glow:"rgba(233,238,245,.18)" },
      x:          { color:"#E9EEF5", glow:"rgba(233,238,245,.18)" },
      facebook:   { color:"#1877F2", glow:"rgba(24,119,242,.28)" },
      instagram:  { color:"#E1306C", glow:"rgba(225,48,108,.30)" },
      whatsapp:   { color:"#25D366", glow:"rgba(37,211,102,.26)" },
      threads:    { color:"#E9EEF5", glow:"rgba(233,238,245,.18)" },
      tiktok:     { color:"#00F2EA", glow:"rgba(0,242,234,.26)" },
      snapchat:   { color:"#FFFC00", glow:"rgba(255,252,0,.18)" },
      youtube:    { color:"#FF0033", glow:"rgba(255,0,51,.26)" },
      twitch:     { color:"#9146FF", glow:"rgba(145,70,255,.26)" },
      telegram:   { color:"#26A5E4", glow:"rgba(38,165,228,.26)" },
      discord:    { color:"#5865F2", glow:"rgba(88,101,242,.26)" },
      github:     { color:"#E9EEF5", glow:"rgba(233,238,245,.18)" },
      linkedin:   { color:"#0A66C2", glow:"rgba(10,102,194,.26)" },
      reddit:     { color:"#FF4500", glow:"rgba(255,69,0,.26)" },
      pinterest:  { color:"#E60023", glow:"rgba(230,0,35,.26)" },
      generic:    { color:"#E9EEF5", glow:"rgba(233,238,245,.18)" },
    };

    /***********************
     * ICONS (más “originales”)
     ***********************/
    const ICONS = {
      email: svgMail(),
      x: svgTwitterX(),
      facebook: svgFacebook(),
      instagram: svgInstagram(),
      whatsapp: svgWhatsApp(),
      threads: svgThreads(),
      tiktok: svgTikTok(),
      snapchat: svgSnapchat(),
      youtube: svgYouTube(),
      twitch: svgTwitch(),
      telegram: svgTelegram(),
      discord: svgDiscord(),
      github: svgGithub(),
      linkedin: svgLinkedIn(),
      reddit: svgReddit(),
      pinterest: svgPinterest(),
      generic: svgGeneric(),
    };

    const ORDER = [
      "email","x","facebook","instagram","whatsapp","threads","tiktok","snapchat",
      "youtube","twitch","telegram","discord","github","linkedin","reddit","pinterest"
    ];

    (async function init(){
      // ✅ tema
      setTheme(getTheme());

      // ✅ detectar usuario por ?u= o por /@usuario (por si abren index directo)
      const fromQuery = getParam("u");
      const fromPath = getUserFromPath();
      const u = sanitizeUsername(fromQuery || fromPath || DEFAULT_USERNAME);

      await loadProfile(u);
    })();

    window.loadProfile = loadProfile;

    async function loadProfile(username){
      const safeU = sanitizeUsername(username);

      // ✅ IMPORTANTÍSIMO: limpia todo ANTES de cargar (evita “se quedó el de soulink”)
      renderIcons([]);
      setState("Cargando…");

      document.title = `@${safeU} • soulink.bio`;
      document.getElementById("nameText").textContent = `@${safeU}`;
      document.getElementById("handleText").textContent = `soulink.bio/@${safeU}`;

      try{
        const row = await fetchUserRowFromCSV(SHEETS_CSV_URL, safeU);
        if(!row){
          renderIcons([]);
          setState("Este usuario todavía no existe en la base de datos.");
          return;
        }

        const links = extractLinksFromRow(row);
        const sorted = sortLinks(links);

        renderIcons(sorted);
        setState(sorted.length ? "" : "No hay redes sociales guardadas todavía.");
      }catch(e){
        console.error(e);
        renderIcons([]);
        setState("No pude cargar la data. Verifica que el Sheet esté publicado.");
      }
    }

    function renderIcons(links){
      const box = document.getElementById("icons");
      box.innerHTML = "";

      links.forEach(l=>{
        const a = document.createElement("a");
        a.className = "iconBtn";
        a.href = l.url;
        a.target = "_blank";
        a.rel = "noopener noreferrer";
        a.title = l.type.toUpperCase();

        const b = BRAND[l.type] || BRAND.generic;
        a.style.setProperty("--brandColor", b.color);
        a.style.setProperty("--brandGlow", b.glow);

        const inner = document.createElement("div");
        inner.className = "iconCircle";
        inner.innerHTML = ICONS[l.type] || ICONS.generic;

        a.appendChild(inner);
        box.appendChild(a);
      });
    }

    async function fetchUserRowFromCSV(csvUrl, username){
      const res = await fetch(csvUrl, { cache:"no-store" });
      if(!res.ok) throw new Error("CSV fetch failed: " + res.status);
      const text = await res.text();
      const { headers, rows } = parseCSV(text);

      const objs = rows.map(r=>{
        const o={}; headers.forEach((h,i)=> o[h]=(r[i]??"").trim()); return o;
      });

      const key = username.toLowerCase();

      // ✅ acepta varias columnas para username
      return objs.find(o => {
        const v = (o.username || o.user || o.handle || o.usuario || o.u || "").toLowerCase().trim();
        return v === key;
      }) || null;
    }

    function extractLinksFromRow(row){
      // ✅ Solo saca estas columnas (las que tú listaste)
      const wanted = [
        "email","x","facebook","instagram","whatsapp","threats","threads",
        "tiktok","snapchat","youtube","twitch","telegram","discord","github","linkedln","linkedin","reddit","pinterest"
      ];

      const links = [];
      for(const k in row){
        const rawKey = String(k||"");
        const norm = normalizeType(rawKey);
        if(!wanted.includes(norm) && norm !== "threads" && norm !== "email") continue;

        const val = String(row[k]||"").trim();
        if(!val) continue;

        // email: si viene como correo suelto, conviértelo a mailto:
        if(norm === "email"){
          const mail = val.replace(/^mailto:/i,"").trim();
          if(mail.includes("@")) links.push({ type:"email", url: "mailto:" + mail });
          continue;
        }

        if(isValidUrl(val)){
          links.push({ type: norm, url: normalizeUrl(val) });
        }
      }

      // dedupe
      const seen = new Set();
      return links.filter(l=>{
        const key = l.type + "|" + l.url;
        if(seen.has(key)) return false;
        seen.add(key);
        return true;
      });
    }

    function sortLinks(links){
      const rank = (t)=> {
        const i = ORDER.indexOf(t);
        return i === -1 ? 999 : i;
      };
      return links.slice().sort((a,b)=> rank(a.type) - rank(b.type));
    }

    function normalizeType(header){
      const h = String(header||"").trim().toLowerCase();
      const clean = h.replace(/\s+/g,"").replace(/_/g,"").replace(/-/g,"");

      if(clean === "email") return "email";
      if(clean === "x" || clean === "twitter") return "x";
      if(clean === "facebook" || clean === "fb") return "facebook";
      if(clean === "instagram" || clean === "ig") return "instagram";
      if(clean === "whatsapp" || clean === "wa") return "whatsapp";

      // tu columna dice THREATS, lo trato como Threads:
      if(clean === "threads" || clean === "threats") return "threads";

      if(clean === "tiktok") return "tiktok";
      if(clean === "snapchat" || clean === "snap") return "snapchat";
      if(clean === "youtube" || clean === "yt") return "youtube";
      if(clean === "twitch") return "twitch";
      if(clean === "telegram" || clean === "tg") return "telegram";
      if(clean === "discord") return "discord";
      if(clean === "github") return "github";
      if(clean === "linkedln" || clean === "linkedin") return "linkedin";
      if(clean === "reddit") return "reddit";
      if(clean === "pinterest") return "pinterest";

      return "generic";
    }

    function parseCSV(text){
      const lines=text.replace(/\r/g,"").split("\n").filter(Boolean);
      const rows=[]; let headers=[];
      for(let i=0;i<lines.length;i++){
        const row=splitCSVLine(lines[i]);
        if(i===0) headers=row.map(h=>normalizeHeader(h));
        else rows.push(row);
      }
      return { headers, rows };
    }

    function splitCSVLine(line){
      const out=[]; let cur=""; let q=false;
      for(let i=0;i<line.length;i++){
        const ch=line[i];
        if(ch === '"' && line[i+1] === '"'){ cur+='"'; i++; continue; }
        if(ch === '"'){ q=!q; continue; }
        if(ch === "," && !q){ out.push(cur); cur=""; continue; }
        cur += ch;
      }
      out.push(cur);
      return out;
    }

    function normalizeHeader(h){
      return String(h||"").trim().toLowerCase()
        .replace(/\s+/g,"_")
        .replace(/[^\w]/g,"");
    }

    function normalizeUrl(u){
      const s=String(u||"").trim();
      if(!s) return "";
      if(/^https?:\/\//i.test(s)) return s;
      if(/^mailto:/i.test(s)) return s;
      return "https://" + s;
    }

    function isValidUrl(u){
      const s=String(u||"").trim();
      if(!s) return false;
      if(/^mailto:/i.test(s)) return true;
      try{ new URL(normalizeUrl(s)); return true; }catch(e){ return false; }
    }

    function sanitizeUsername(u){
      return String(u||"").trim().replace(/^@/,"").replace(/[^\w.-]/g,"").slice(0,40) || "usuario";
    }

    function setState(msg){ document.getElementById("state").textContent = msg || ""; }

    function getParam(name){
      try{ return new URL(location.href).searchParams.get(name); }
      catch(e){ return null; }
    }

    function getUserFromPath(){
      try{
        const path = decodeURIComponent(location.pathname || "/");
        const m = path.match(/^\/@([^\/?#]+)/);
        return m ? m[1].replace(/^@/,"") : null;
      }catch(e){
        return null;
      }
    }

    /***********************
     * SVGs
     ***********************/
    function svgSun(){
      return `<svg viewBox="0 0 24 24" fill="none">
        <path d="M12 18a6 6 0 1 0 0-12a6 6 0 0 0 0 12Z" stroke="currentColor" stroke-width="2"/>
        <path d="M12 2v2M12 20v2M4 12H2M22 12h-2M5 5l1.4 1.4M17.6 17.6 19 19M19 5l-1.4 1.4M6.4 17.6 5 19" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      </svg>`;
    }
    function svgMoon(){
      return `<svg viewBox="0 0 24 24" fill="none">
        <path d="M21 13.6A8.2 8.2 0 0 1 10.4 3a6.9 6.9 0 1 0 10.6 10.6Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>`;
    }

    function svgMail(){ return `<svg viewBox="0 0 24 24" fill="none"><path d="M4 7h16v10H4V7Z" stroke="currentColor" stroke-width="2"/><path d="M4 8l8 6 8-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>`; }

    // Bootstrap Icons (copy html) — “más iguales”
    function svgTwitterX(){ return `<svg viewBox="0 0 16 16" fill="currentColor"><path d="M12.6.75h2.454l-5.36 6.142L16 15.25h-4.937l-3.867-5.07-4.425 5.07H.316l5.733-6.57L0 .75h5.063l3.495 4.633L12.601.75Zm-.86 13.028h1.36L4.323 2.145H2.865z"/></svg>`; }
    function svgFacebook(){ return `<svg viewBox="0 0 16 16" fill="currentColor"><path d="M16 8.049c0-4.446-3.582-8.05-8-8.05C3.58 0-.002 3.603-.002 8.05c0 4.017 2.926 7.347 6.75 7.951v-5.625h-2.03V8.05H6.75V6.275c0-2.017 1.195-3.131 3.022-3.131.876 0 1.791.157 1.791.157v1.98h-1.009c-.993 0-1.303.621-1.303 1.258v1.51h2.218l-.354 2.326H9.25V16c3.824-.604 6.75-3.934 6.75-7.951"/></svg>`; }
    function svgWhatsApp(){ return `<svg viewBox="0 0 16 16" fill="currentColor"><path d="M13.601 2.326A7.85 7.85 0 0 0 7.994 0C3.627 0 .068 3.558.064 7.926c0 1.399.366 2.76 1.057 3.965L0 16l4.204-1.102a7.9 7.9 0 0 0 3.79.965h.004c4.368 0 7.926-3.558 7.93-7.93A7.9 7.9 0 0 0 13.6 2.326zM7.994 14.521a6.6 6.6 0 0 1-3.356-.92l-.24-.144-2.494.654.666-2.433-.156-.251a6.56 6.56 0 0 1-1.007-3.505c0-3.626 2.957-6.584 6.591-6.584a6.56 6.56 0 0 1 4.66 1.931 6.56 6.56 0 0 1 1.928 4.66c-.004 3.639-2.961 6.592-6.592 6.592m3.615-4.934c-.197-.099-1.17-.578-1.353-.646-.182-.065-.315-.099-.445.099-.133.197-.513.646-.627.775-.114.133-.232.148-.43.05-.197-.1-.836-.308-1.592-.985-.59-.525-.985-1.175-1.103-1.372-.114-.198-.011-.304.088-.403.087-.088.197-.232.296-.346.1-.114.133-.198.198-.33.065-.134.034-.248-.015-.347-.05-.099-.445-1.076-.612-1.47-.16-.389-.323-.335-.445-.34-.114-.007-.247-.007-.38-.007a.73.73 0 0 0-.529.247c-.182.198-.691.677-.691 1.654s.71 1.916.81 2.049c.098.133 1.394 2.132 3.383 2.992.47.205.84.326 1.129.418.475.152.904.129 1.246.08.38-.058 1.171-.48 1.338-.943.164-.464.164-.86.114-.943-.049-.084-.182-.133-.38-.232"/></svg>`; }
