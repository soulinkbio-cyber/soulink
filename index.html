<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>soulink.bio</title>

<style>
:root{
  --bg:#0b1220;
  --card:#141c2b;
  --text:#e9eef5;
  --muted:#9aa7b5;
}

*{box-sizing:border-box}

body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial;
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  background:radial-gradient(1200px 600px at 50% -10%, #1a2540, #070b12);
  color:var(--text);
}

.card{
  width:360px;
  background:linear-gradient(180deg,#1a2336,#0f1625);
  border-radius:28px;
  padding:28px 22px 26px;
  box-shadow:0 40px 90px rgba(0,0,0,.6);
  text-align:center;
}

.username{
  font-size:28px;
  font-weight:800;
  margin:0;
}

.handle{
  margin:6px 0 22px;
  font-size:14px;
  color:var(--muted);
}

.grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:14px;
}

.icon{
  width:64px;
  height:64px;
  border-radius:18px;
  background:rgba(255,255,255,.04);
  display:flex;
  align-items:center;
  justify-content:center;
  transition:transform .15s ease, background .15s ease;
}

.icon:hover{
  transform:translateY(-2px);
  background:rgba(255,255,255,.08);
}

.icon img{
  width:38px;
  height:38px;
}

.footer{
  margin-top:18px;
  font-size:12px;
  color:var(--muted);
}
</style>
</head>

<body>

<div class="card">
  <h1 class="username" id="username">@soulink</h1>
  <div class="handle" id="handle">soulink.bio/@soulink</div>

  <div class="grid" id="icons"></div>

  <div class="footer">© soulink.bio</div>
</div>

<script>
const ICONS = {
  x: "/assets/icons/x.png",
  facebook: "/assets/icons/facebook.png",
  instagram: "/assets/icons/instagram.png",
  whatsapp: "/assets/icons/whatsapp.png",
  threads: "/assets/icons/threads.png",
  tiktok: "/assets/icons/tiktok.png",
  snapchat: "/assets/icons/snapchat.png",
  youtube: "/assets/icons/youtube.png",
  twitch: "/assets/icons/twitch.png",
  telegram: "/assets/icons/telegram.png",
  discord: "/assets/icons/discord.png",
  github: "/assets/icons/github.png",
  reddit: "/assets/icons/reddit.png",
  pinterest: "/assets/icons/pinterest.png",
  email: "/assets/icons/email.png"
};

const ORDER = [
  "x","facebook","instagram","whatsapp",
  "threads","tiktok","snapchat","youtube",
  "twitch","telegram","discord","github",
  "reddit","pinterest","email"
];

const DEFAULT_USER = "soulink";

window.loadProfile = function(user){
  const u = user || DEFAULT_USER;
  document.getElementById("username").textContent = "@"+u;
  document.getElementById("handle").textContent = "soulink.bio/@"+u;
  renderIcons();
};

function renderIcons(){
  const box = document.getElementById("icons");
  box.innerHTML = "";
  ORDER.forEach(key=>{
    const a = document.createElement("a");
    a.href = "#";
    a.className = "icon";
    a.innerHTML = `<img src="${ICONS[key]}" alt="${key}">`;
    box.appendChild(a);
  });
}

// carga normal /
const p = new URLSearchParams(location.search);
loadProfile(p.get("u") || DEFAULT_USER);
</script>

</body>
</html>
