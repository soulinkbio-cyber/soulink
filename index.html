<!doctype html>
<html lang="es" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="theme-color" content="#0b0f14" />
  <title>soulink.bio</title>

  <style>
    :root{
      --bg0:#05070a; --bg1:#0b0f14;
      --card:#0e141b; --card2:#0b1117;
      --text:#e9eef5; --muted:#9aa7b5;
      --stroke:rgba(255,255,255,.10); --stroke2:rgba(255,255,255,.06);
      --shadow:0 18px 60px rgba(0,0,0,.55);
      --radius:22px;
      --maxw:540px;
    }
    html[data-theme="light"]{
      --bg0:#f7f9fb; --bg1:#eef3f7;
      --card:#ffffff; --card2:#f7f9fb;
      --text:#0b0f14; --muted:#566474;
      --stroke:rgba(10,15,20,.14); --stroke2:rgba(10,15,20,.08);
      --shadow:0 18px 50px rgba(0,0,0,.12);
    }

    *{box-sizing:border-box}
    body{
      margin:0;
      font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial;
      color:var(--text);
      min-height:100svh;
      background:
        radial-gradient(1200px 650px at 18% 12%, rgba(120,170,255,.14), transparent 55%),
        radial-gradient(900px 520px at 82% 18%, rgba(220,240,255,.18), transparent 50%),
        linear-gradient(160deg, var(--bg0), var(--bg1));
    }

    .wrap{max-width:var(--maxw); margin:0 auto; padding:26px 16px;}
    .card{
      border-radius:var(--radius);
      border:1px solid var(--stroke2);
      background:linear-gradient(180deg, var(--card), var(--card2));
      box-shadow:var(--shadow);
      position:relative;
      overflow:hidden;
    }

    .topTools{ position:absolute; top:12px; right:12px; }
    .toggleBtn{
      width:36px; height:36px;
      border-radius:12px;
      border:1px solid var(--stroke2);
      background:transparent;
      color:var(--text);
      cursor:pointer;
      font-size:16px;
    }

    .profile{ padding:26px 18px 6px; text-align:center; }
    .username{
      margin:0;
      font-size:21px;      /* proporcional */
      font-weight:850;
      letter-spacing:.2px;
      word-break:break-word;
    }
    .handle{ margin:4px 0 0; font-size:12px; color:var(--muted); }

    .iconsWrap{ padding:16px 16px 22px; }
    .icons{
      display:grid;
      grid-template-columns:repeat(5,1fr);
      gap:12px;
    }
    @media(max-width:420px){ .icons{grid-template-columns:repeat(4,1fr);} }

    .iconBtn{
      height:54px;
      border-radius:18px;
      border:1px solid var(--stroke2);
      display:grid;
      place-items:center;
      background:transparent;
      transition:.15s;
      text-decoration:none;
    }
    .iconBtn:hover{ transform:translateY(-2px); border-color:rgba(255,255,255,.18); }
    .iconBtn svg{ width:24px; height:24px; color:var(--brandColor,#e9eef5); }

    .state{ padding:0 16px 16px; text-align:center; font-size:13px; color:var(--muted); }
    .footer{ padding:14px 16px 18px; text-align:center; font-size:12px; color:var(--muted); }
  </style>
</head>

<body>
<div class="wrap">
  <div class="card">
    <div class="topTools">
      <button class="toggleBtn" id="themeBtn" aria-label="Cambiar tema">🌓</button>
    </div>

    <div class="profile">
      <h1 class="username" id="nameText">@soulink</h1>
      <p class="handle" id="handleText">soulink.bio/@soulink</p>
    </div>

    <div class="iconsWrap">
      <div class="icons" id="icons"></div>
    </div>

    <div class="state" id="state"></div>
    <div class="footer">© soulink.bio</div>
  </div>
</div>

/*** ORDER: todas las redes ***/
const ORDER = [
  "email","x","facebook","instagram","whatsapp","threads","tiktok","snapchat",
  "youtube","twitch","telegram","discord","github","linkedin","reddit","pinterest"
];

/*** PUBLIC INIT (para 404.html) ***/
window.init = init;
init(); // carga con ?u= o default

async function init(forceUser){
  const u = sanitizeUsername(forceUser || getParam("u") || DEFAULT_USERNAME);
  document.title = `@${u} • soulink.bio`;
  document.getElementById("nameText").textContent = "@"+u;
  document.getElementById("handleText").textContent = "soulink.bio/@"+u;
  await loadLinks(u);
}

async function loadLinks(u){
  setState("Cargando…");
  const res = await fetch(SHEETS_CSV_URL, {cache:"no-store"});
  if(!res.ok){ setState("No pude leer el Sheet publicado."); return; }
  const txt = await res.text();

  const {headers, rows} = parseCSV(txt);
  const idxUser = headers.indexOf("username");
  if(idxUser === -1){ setState("Falta la columna username."); return; }

  const key = u.toLowerCase();
  const row = rows.find(r => (r[idxUser]||"").toLowerCase() === key);

  if(!row){ renderIcons([]); setState("Usuario no encontrado."); return; }

  const links = [];
  for(const type of ORDER){
    const idx = headers.indexOf(type);
    if(idx === -1) continue;
    const raw = (row[idx] || "").trim();
    if(!raw) continue;

    let url = raw;
    if(type === "email"){
      url = raw.includes("@") ? ("mailto:" + raw.replace(/^mailto:/i,"")) : raw;
    }else{
      if(!/^https?:\/\//i.test(url)) url = "https://" + url;
    }
    links.push({type, url});
  }

  renderIcons(links);
  setState(links.length ? "" : "No hay redes guardadas todavía.");
}

function renderIcons(links){
  const box = document.getElementById("icons");
  box.innerHTML = "";
  links.forEach(l=>{
    const a = document.createElement("a");
    a.className = "iconBtn";
    a.href = l.url;
    a.target = "_blank";
    a.rel = "noopener noreferrer";
    a.title = l.type.toUpperCase();
    a.style.setProperty("--brandColor", BRAND[l.type] || "#e9eef5");
    a.innerHTML = ICONS[l.type] || "";
    box.appendChild(a);
  });
}

function setState(msg){ document.getElementById("state").textContent = msg || ""; }

document.getElementById("themeBtn").onclick = ()=>{
  const h = document.documentElement;
  h.dataset.theme = (h.dataset.theme === "dark") ? "light" : "dark";
};

function getParam(name){
  try{ return new URL(location.href).searchParams.get(name); }catch(e){ return null; }
}
function sanitizeUsername(u){
  return String(u||"").trim().replace(/^@/,"").replace(/[^\w.-]/g,"").slice(0,40) || DEFAULT_USERNAME;
}

/*** CSV PARSER (maneja comillas) + normaliza headers ***/
function parseCSV(text){
  const lines = text.replace(/\r/g,"").split("\n").filter(l => l.trim().length);
  if(!lines.length) return {headers:[], rows:[]};

  const headers = splitCSVLine(lines[0]).map(h => normalizeHeader(h));
  const rows = lines.slice(1).map(splitCSVLine).map(r => r.map(v => (v||"").trim()));
  return {headers, rows};
}
function splitCSVLine(line){
  const out=[]; let cur=""; let q=false;
  for(let i=0;i<line.length;i++){
    const ch=line[i];
    if(ch === '"' && line[i+1] === '"'){ cur+='"'; i++; continue; }
    if(ch === '"'){ q=!q; continue; }
    if(ch === "," && !q){ out.push(cur); cur=""; continue; }
    cur += ch;
  }
  out.push(cur);
  return out;
}
function normalizeHeader(h){
  const clean = String(h||"").trim().toLowerCase()
    .replace(/\s+/g,"")
    .replace(/_/g,"")
    .replace(/-/g,"");
  if(clean === "threats" || clean === "threads") return "threads";
  if(clean === "linkedln" || clean === "linkedin") return "linkedin";
  return clean;
}
